[project]
name = "aweb-secrets"
version = "0.1.0"
description = "Brokered use of secrets by AWID team members, without handing them the values"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aweb-naapp[runtime]",
  "awid-service",
  "pgdbm>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb/tree/main/naapp/secrets"
Repository = "https://github.com/awebai/aweb"
Issues = "https://github.com/awebai/aweb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_secrets"]

# awid-service and aweb-naapp are not on PyPI. secrets runs on the awid and naapp-lib
# of the aweb checkout it lives in, so a Docker build must use the repository root as
# its context.
[tool.uv.sources]
awid-service = { path = "../../awid", editable = true }
aweb-naapp = { path = "../../naapp-lib", editable = true }
aweb-naapp-testing = { path = "../../naapp-lib/testing", editable = true }

[dependency-groups]
dev = [
  "aweb-naapp-testing",
  "cryptography>=50.0.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
  "botocore>=1.43.115",
]

[tool.pytest.ini_options]
pythonpath = ["src", "e2e"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
