# The H owner-acts journey's services (tests/test_e2e_owner_acts.py).
# The test writes SECRETS_E2E_RUNTIME (DNS zone, TLS, keys, member files)
# before it starts each service, and drives the real aw only inside the cli
# containers. Everything is disposable: generated keys, tmpfs databases.
services:
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/zones/Corefile"]
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/dns:/zones:ro"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secrets
      POSTGRES_PASSWORD: disposable
      POSTGRES_DB: secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrets -d secrets"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    build: {context: ../.., dockerfile: awid/Dockerfile}
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWID_DATABASE_URL: postgresql://secrets:disposable@postgres:5432/secrets
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_DB_SCHEMA: awid
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_PUBLIC_ORIGINS: http://awid.svc.test:8010
      AWID_RATE_LIMIT_DISABLED: "1"
      AWID_ALLOW_INSECURE_DELIVERY_ORIGIN: "1"
      APP_ENV: development
    networks:
      default:
        aliases: ["awid.svc.test"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  aweb:
    build: {context: ../.., dockerfile: server/Dockerfile}
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWEB_DATABASE_URL: postgresql://secrets:disposable@postgres:5432/secrets
      AWEB_REDIS_URL: redis://redis:6379/1
      AWID_REGISTRY_URL: http://awid.svc.test:8010
      AWEB_PUBLIC_ORIGIN: http://aweb.svc.test:8000
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 8000
      SSL_CERT_FILE: /runtime/tls/ca.pem
      APP_ENV: development
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    networks:
      default:
        aliases: ["aweb.svc.test"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      awid: {condition: service_started}

  smtp:
    image: axllent/mailpit:v1.27
    networks:
      default:
        aliases: ["smtp.svc.test"]

  # The production image, as a customer runs it: HTTP behind a TLS front.
  secrets:
    build:
      context: ../..
      dockerfile: naapp/secrets/Dockerfile
      args:
        SOURCE_COMMIT: "${SECRETS_E2E_SOURCE_COMMIT:?}"
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    env_file: ["${SECRETS_E2E_RUNTIME:?}/secrets.env"]
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/keys:/run/secrets-keys:ro"
    depends_on:
      postgres: {condition: service_healthy}
      awid: {condition: service_started}
      smtp: {condition: service_started}

  # Terminates TLS for both public hostnames and keeps the public Host, which
  # the app's split_origins allowlist matches.
  front:
    image: caddy:2.10-alpine
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/front/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${SECRETS_E2E_RUNTIME:?}/tls:/tls:ro"
    networks:
      default:
        aliases: ["api.secrets.svc.test", "console.secrets.svc.test"]
    depends_on:
      secrets: {condition: service_started}

  # The real aw. The holder's human key lives in this container's own
  # Secret Service (dbus + gnome-keyring); the controller runs in another one.
  cli:
    build: {context: ../.., dockerfile: scripts/federation-cli.Dockerfile}
    cap_add: [IPC_LOCK]
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    entrypoint: ["sleep", "infinity"]
    environment:
      SSL_CERT_FILE: /runtime/tls/ca.pem
      AW_NO_UPDATE_CHECK: "1"
      APP_ENV: development
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}:/runtime"

  browser:
    build: {context: ../.., dockerfile: naapp/secrets/e2e/owner_acts/browser.Dockerfile}
    profiles: ["browser"]
