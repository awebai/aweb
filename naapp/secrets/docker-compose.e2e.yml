# The H owner-acts journey's services (tests/test_e2e_owner_acts.py), and,
# in its Logs profile. The lane runs Logs under the
# "logs" profile: the audit target a designation's governance needs.
# The test writes SECRETS_E2E_RUNTIME (DNS zone, TLS, keys, member files)
# before it starts each service, and drives the real aw only inside the cli
# containers. Everything is disposable: generated keys, tmpfs databases.
services:
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/zones/Corefile"]
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/dns:/zones:ro"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secrets
      POSTGRES_PASSWORD: disposable
      POSTGRES_DB: secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrets -d secrets"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    build: {context: ../.., dockerfile: awid/Dockerfile}
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWID_DATABASE_URL: postgresql://secrets:disposable@postgres:5432/secrets
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_DB_SCHEMA: awid
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_PUBLIC_ORIGINS: http://awid.svc.test:8010
      AWID_RATE_LIMIT_DISABLED: "1"
      # The lane's own registry: the operator token aweb's private-team reads
      # use, generated per run by the test and never written to a file.
      AWID_SERVICE_TOKEN: "${SECRETS_E2E_AWID_SERVICE_TOKEN:?}"
      AWID_ALLOW_INSECURE_DELIVERY_ORIGIN: "1"
      APP_ENV: development
    networks:
      default:
        aliases: ["awid.svc.test"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  aweb:
    build: {context: ../.., dockerfile: server/Dockerfile}
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWEB_DATABASE_URL: postgresql://secrets:disposable@postgres:5432/secrets
      AWEB_REDIS_URL: redis://redis:6379/1
      AWID_REGISTRY_URL: http://awid.svc.test:8010
      AWID_SERVICE_TOKEN: "${SECRETS_E2E_AWID_SERVICE_TOKEN:?}"
      AWEB_PUBLIC_ORIGIN: https://aweb.svc.test
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 8000
      SSL_CERT_FILE: /runtime/tls/ca.pem
      APP_ENV: development
      # The operator's internal apps: the lane's own Secrets and Logs, on its network.
      AWEB_APP_INTERNAL_ORIGINS: '["https://api.secrets.svc.test", "https://api.logs.svc.test"]'
      AWEB_APP_INTERNAL_CIDR: "${SECRETS_E2E_SUBNET:-172.31.240.0/24}"
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      awid: {condition: service_started}

  smtp:
    image: axllent/mailpit:v1.27
    networks:
      default:
        aliases: ["smtp.svc.test"]

  # The production image, as a customer runs it: HTTP behind a TLS front.
  secrets:
    build:
      context: ../..
      dockerfile: naapp/secrets/Dockerfile
      args:
        SOURCE_COMMIT: "${SECRETS_E2E_SOURCE_COMMIT:?}"
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    env_file: ["${SECRETS_E2E_RUNTIME:?}/secrets.env"]
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/keys:/run/secrets-keys:ro"
    depends_on:
      postgres: {condition: service_healthy}
      awid: {condition: service_started}
      smtp: {condition: service_started}

  # Terminates TLS for the public hostnames and keeps the public Host, which
  # the app's split_origins allowlist matches; aweb.svc.test is the team's
  # coordination server, so the team publishes an https server.
  front:
    image: caddy:2.10-alpine
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/front/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${SECRETS_E2E_RUNTIME:?}/tls:/tls:ro"
    networks:
      default:
        aliases: ["aweb.svc.test", "api.secrets.svc.test", "console.secrets.svc.test", "api.logs.svc.test",
                  "console.logs.svc.test", "signer.svc.test", "human.svc.test"]

  # The real aw. The holder's human key lives in this container's own
  # Secret Service (dbus + gnome-keyring); the controller runs in another one.
  cli:
    build: {context: ../.., dockerfile: scripts/federation-cli.Dockerfile}
    cap_add: [IPC_LOCK]
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    entrypoint: ["sleep", "infinity"]
    environment:
      SSL_CERT_FILE: /runtime/tls/ca.pem
      AW_NO_UPDATE_CHECK: "1"
      APP_ENV: development
      # aw's default registry is the public one; every aw in a lane uses the
      # lane's own registry, which the network below makes the only one it
      # can reach.
      AWID_REGISTRY_URL: http://awid.svc.test:8010
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}:/runtime"

  browser:
    build: {context: ../.., dockerfile: naapp/secrets/e2e/owner_acts/browser.Dockerfile}
    profiles: ["browser"]

  logs:
    profiles: ["logs"]
    extends: {file: ../logs/compose.logs.yaml, service: logs}
    build:
      context: ../..
      dockerfile: naapp/logs/Dockerfile
      args:
        SOURCE_COMMIT: "${SECRETS_E2E_SOURCE_COMMIT:?}"
    restart: "no"
    dns: ["${SECRETS_E2E_DNS_IP:-127.0.0.11}"]
    # Lane facts only, never in the deployment base: every other setting
    # comes through compose.logs.yaml.
    environment:
      # The team's domain names the lane's http registry, which awid accepts
      # only in development, as every other lane service runs.
      APP_ENV: development
      # The team's coordination server behind the lane's TLS front: the
      # operator's own, so Logs reaches it directly, trusting the lane's CA.
      LOGS_TEAM_SERVER_INTERNAL_ORIGINS: '["https://aweb.svc.test"]'
      SSL_CERT_FILE: /runtime/tls/ca.pem
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/logs:/run/secrets/logs:ro"
      - "${SECRETS_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    depends_on:
      postgres: {condition: service_healthy}
      awid: {condition: service_started}
      smtp-tls: {condition: service_started}

  # The captured notification transport: TLS and authentication, as the
  # mailers require, with the mailbox read only by the test driver.
  smtp-tls:
    profiles: ["logs"]
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_TLS_CERT: /runtime/tls/smtp.pem
      MP_SMTP_TLS_KEY: /runtime/tls/smtp-key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - "${SECRETS_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    networks:
      default:
        aliases: ["mail.svc.test"]

  chromium:
    build: {context: ../.., dockerfile: naapp/secrets/e2e/browser/chromium.Dockerfile}
    profiles: ["chromium"]

# No lane container reaches the internet: an aw or service default that names
# a public origin fails here instead of sending test traffic out. Images are
# pulled and built by the Docker daemon, outside this network.
networks:
  default:
    internal: true
    # A fixed subnet, so the operator settings can name the apps' network.
    ipam:
      config:
        - subnet: "${SECRETS_E2E_SUBNET:-172.31.240.0/24}"
