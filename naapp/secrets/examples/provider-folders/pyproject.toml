[project]
name = "aweb-provider-folders"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi==2026.10.23",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.uv.sources]
aweb-secrets-values = { path = "../../values", editable = true }

[dependency-groups]
dev = [
    "aweb-secrets-values",
    "pytest>=9,<10",
    "quickxorhash>=1.0.5",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
