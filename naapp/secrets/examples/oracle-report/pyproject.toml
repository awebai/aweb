[project]
name = "aweb-oracle-lab-report"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["oracledb==26.1.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
