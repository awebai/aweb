[project]
name = "aweb-secrets-runner"
version = "0.1.0"
description = "Outbound runner for pinned aweb secrets jobs"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["base58>=2.1.1", "cryptography>=50.0.0"]

[project.scripts]
aweb-secrets-runner = "aweb_secrets_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_secrets_runner"]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.14.0", "mypy>=1.18.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
