[project]
name = "aweb-secrets-runner"
version = "0.1.0"
description = "Outbound runner for pinned aweb secrets jobs"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aweb-naapp[pages]",
  "aweb-secrets-values",
  "base58>=2.1.1",
  "cryptography>=50.0.0",
]

[tool.uv.sources]
aweb-naapp = { path = "../../../naapp-lib", editable = true }
aweb-secrets-values = { path = "../values", editable = true }

[project.scripts]
aweb-secrets-runner = "aweb_secrets_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_secrets_runner"]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.14.0", "mypy>=1.18.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["aweb_naapp.pages"]
ignore_missing_imports = true
