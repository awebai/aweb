[project]
name = "aweb-secrets-values"
version = "0.1.0"
description = "Structured credential value codec shared by secrets and its runner"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_secrets_values"]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.14.0", "mypy>=1.18.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
