# The SECRETS app as every Compose file here runs it. A file that runs it
# extends this service and adds the image, its secrets mount, its network
# and its port.
#
# Every credential is a file under /run/secrets/secrets, which no agent and no
# other service mounts; none is in the environment. The image carries the
# healthcheck: /live, asked with the Host of SECRETS_PUBLIC_ORIGIN.
services:
  secrets:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SECRETS_DATABASE_URL_FILE: /run/secrets/secrets/database-url
      SECRETS_DB_SCHEMA: ${SECRETS_DB_SCHEMA:-public}
      SECRETS_APP_ID: ${SECRETS_APP_ID:?SECRETS_APP_ID is required, secrets.appId}
      SECRETS_PUBLIC_ORIGIN: ${SECRETS_PUBLIC_ORIGIN:?SECRETS_PUBLIC_ORIGIN is required, secrets.publicOrigin}
      SECRETS_CONSOLE_ORIGIN: ${SECRETS_CONSOLE_ORIGIN:?SECRETS_CONSOLE_ORIGIN is required, secrets.consoleOrigin}
      SECRETS_AWID_REGISTRY_URL: ${AWID_REGISTRY_URL:-https://api.awid.ai}
      # The app is an ordinary member of the team: it holds that member's key
      # and certificate, and no AWID_SERVICE_TOKEN.
      SECRETS_AWID_MEMBER_CREDENTIALS: >-
        {"${TEAM_ID:?TEAM_ID is required, team.id}":
        {"signing_key_file": "/run/secrets/secrets/awid-member-key",
        "certificate_file": "/run/secrets/secrets/awid-member-certificate"}}
      SECRETS_APP_KEY_FILES: >-
        {"secrets.hook-event-1": "/run/secrets/secrets/hook-event",
        "secrets.hook-delivery-1": "/run/secrets/secrets/hook-delivery",
        "secrets:grant-read-1": "/run/secrets/secrets/grant-read",
        "secrets:hook-resolve-1": "/run/secrets/secrets/hook-resolve"}
      SECRETS_MANIFEST_REQUEST_KEY_FILE: /run/secrets/secrets/manifest-request-key
      # Exactly one of the two: the custody key is the mounted file
      # /run/secrets/secrets/custody-key, unless the operator names a KMS key.
      SECRETS_CUSTODY_KEY_FILE: ${SECRETS_CUSTODY_KEY_FILE:-}
      SECRETS_KMS_KEY_ID: ${SECRETS_KMS_KEY_ID:-}
      SECRETS_KMS_REGION: ${SECRETS_KMS_REGION:-}
      SECRETS_SECRET_REQUEST_KEY_FILE: /run/secrets/secrets/request-seal-key
      SECRETS_SECRET_PARAMS_KEY_FILE: /run/secrets/secrets/params-seal-key
      SECRETS_RESPONSE_KEY_FILE: /run/secrets/secrets/response-seal-key
      SECRETS_RUNNER_SERVICE_KEY_FILE: /run/secrets/secrets/runner-service-key
      SECRETS_EMAIL_SMTP_HOST: ${SECRETS_EMAIL_SMTP_HOST:?SECRETS_EMAIL_SMTP_HOST is required, secrets.emailSmtpHost}
      SECRETS_EMAIL_SMTP_PORT: ${SECRETS_EMAIL_SMTP_PORT:-587}
      SECRETS_EMAIL_TLS: ${SECRETS_EMAIL_TLS:-starttls}
      SECRETS_EMAIL_USERNAME_FILE: /run/secrets/secrets/smtp-username
      SECRETS_EMAIL_PASSWORD_FILE: /run/secrets/secrets/smtp-password
      SECRETS_EMAIL_FROM: ${SECRETS_EMAIL_FROM:?SECRETS_EMAIL_FROM is required, secrets.emailFrom}
      # Hooks reach a receiver at an internal address only when the operator
      # names its origin, and then only inside the services network.
      SECRETS_HOOK_INTERNAL_ORIGINS: ${SECRETS_HOOK_INTERNAL_ORIGINS:-}
      SECRETS_HOOK_INTERNAL_DESTINATIONS: ${SECRETS_HOOK_INTERNAL_ORIGINS:+allowed}
      SECRETS_HOOK_INTERNAL_CIDR: ${SECRETS_HOOK_INTERNAL_ORIGINS:+${SERVICES_CIDR}}
      SECRETS_EGRESS_DENIED_NETWORKS: ${SECRETS_EGRESS_DENIED_NETWORKS:?SECRETS_EGRESS_DENIED_NETWORKS is required, secrets.egressDeniedNetworks}
      SECRETS_CLIENT_ADDRESS_HEADER: ${SECRETS_CLIENT_ADDRESS_HEADER:-}
