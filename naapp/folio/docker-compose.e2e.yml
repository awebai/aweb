services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - "../../scripts/test-postgres-storage.sh:/test-postgres-storage.sh:ro"
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports:
      - "${FOLIO_E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh /test-postgres-storage.sh"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=1g

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    build:
      context: ${FOLIO_E2E_AWEB_CONTEXT:-../..}
      dockerfile: awid/Dockerfile
    environment:
      AWID_DATABASE_URL: postgresql://folio:folio@postgres:5432/folio
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_DB_SCHEMA: awid
      AWID_LOG_JSON: "false"
      AWID_RATE_LIMIT_BACKEND: redis
      AWID_RATE_LIMIT_DISABLED: "true"
      AWID_SKIP_DNS_VERIFY: "1"
      AWID_SERVICE_TOKEN: ${FOLIO_E2E_AWID_SERVICE_TOKEN:-folio-e2e-awid-service-token-0123456789abcdef}
    ports:
      - "${FOLIO_E2E_AWID_PORT:-18010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30
