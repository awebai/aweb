[project]
name = "aweb-logs"
version = "0.1.0"
description = "A tamper-evident, owner-read audit log of an AWID team's hook events"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aweb-naapp[runtime,hooks]",
  "awid-service",
  "pgdbm>=0.5.0",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb/tree/main/naapp/logs"
Repository = "https://github.com/awebai/aweb"
Issues = "https://github.com/awebai/aweb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_logs"]

# awid-service and aweb-naapp are not on PyPI. logs runs on the awid and naapp-lib
# of the aweb checkout it lives in, so its Docker build uses the repository root as
# its context (see Dockerfile).
[tool.uv.sources]
awid-service = { path = "../../awid", editable = true }
aweb-naapp = { path = "../../naapp-lib", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
