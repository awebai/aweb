name: secrets CI

# secrets' equivalent of folio-ci.yml: lint and type-check, then the unit and
# contract tests, which read secrets' frozen vectors and check them against
# naapp-lib's approval primitive and hook catalog and against awid. Tests fail
# on any warning (pyproject filterwarnings = ["error"]), so a passing run is a
# clean run.
#
# Advisory, like folio-ci.yml: aweb main is not protected, so this check
# reports but cannot block a merge.
#
# No path filter, for the reason library-ci.yml gives: a path-filtered gate is
# how naapp coverage went missing before.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main keeps its own run to the end: one group per commit, since
# a group also cancels its waiting run when another queues. Elsewhere a newer
# run replaces an older one.
concurrency:
  group: secrets-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: secrets lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_MANAGED_PYTHON: "true"
      # naapp tests create databases only on a Postgres the run names (aweb-admf):
      # this job's own postgres service. Each shard names its own.
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The production AWID the fixture starts does not start without Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The Secrets partition runs both shards against separate service pairs.
      postgres_shard:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis_shard:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout aweb
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/secrets/uv.lock

      - name: Install locked secrets dependencies
        working-directory: naapp/secrets
        run: |
          uv sync --locked
          managed_python=$(uv python find --system --resolve-links --managed-python "$UV_PYTHON")
          uv run --no-sync python - "$managed_python" <<'PY'
          import os
          import sys
          from pathlib import Path
          from stat import S_IMODE

          interpreter = Path(sys.executable).resolve()
          info = interpreter.stat()
          print(
              f"Python: {interpreter}, uid={info.st_uid}, "
              f"mode={S_IMODE(info.st_mode):04o}, test uid={os.geteuid()}"
          )
          if interpreter != Path(sys.argv[1]):
              raise SystemExit("Secrets CI must use the uv-managed interpreter")
          PY

      # The production AWID fixture starts this pinned project as prepared
      # here, and never syncs it during the tests.
      - name: Prepare the pinned production AWID
        run: make production-awid-sync

      - name: Install the secrets test browser
        working-directory: naapp/secrets
        run: uv run --no-sync playwright install --with-deps --only-shell chromium

      - name: Lint and type-check
        working-directory: naapp/secrets
        run: make lint

      - name: Run unit and contract tests
        working-directory: naapp/secrets
        env:
          AWEB_SECRETS_SHARD_SERVICES: >-
            [{"postgres_port": 5432, "redis_port": 6379},
             {"postgres_port": ${{ job.services.postgres_shard.ports[5432] }},
              "redis_port": ${{ job.services.redis_shard.ports[6379] }}}]
          PYTEST_ADDOPTS: -rs
        run: make test
