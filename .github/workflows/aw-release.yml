name: Publish aw CLI

on:
  push:
    tags: ["aw-v*"]

permissions:
  contents: read

concurrency:
  group: aw-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync_distribution_source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Copy the tagged CLI source to its distribution repository
        env:
          AW_REPO_TOKEN: ${{ secrets.AW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aw-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          source_sha="$(git rev-parse HEAD)"
          external="$RUNNER_TEMP/aw"
          git clone --branch main \
            "https://x-access-token:${AW_REPO_TOKEN}@github.com/awebai/aw.git" \
            "$external"
          find "$external" -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a cli/go/. "$external/"
          git -C "$external" config user.name 'github-actions[bot]'
          git -C "$external" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$external" add -A
          if ! git -C "$external" diff --cached --quiet; then
            git -C "$external" commit -m "Sync exact aweb ${source_sha}"
            git -C "$external" push origin HEAD:main
          fi
          target="$(git -C "$external" rev-parse HEAD)"
          observed="$(git -C "$external" ls-remote --tags origin "refs/tags/v${version}" | awk '{print $1}')"
          [[ -z "$observed" || "$observed" == "$target" ]] \
            || { echo "v${version} already names $observed, not $target" >&2; exit 1; }
          if [[ -z "$observed" ]]; then
            git -C "$external" tag -a "v${version}" "$target" \
              -m "aw ${version} from aweb ${source_sha}"
            git -C "$external" push origin "refs/tags/v${version}"
          fi
