name: aw Sync and Release

# When we tag aw-vX.Y.Z on aweb, this workflow:
# 1. Pushes cli/go/ contents to awebai/aw (preserving aw's .github/)
# 2. Tags the commit as vX.Y.Z
# The tag push triggers aw's own release workflow (goreleaser + npm).
#
# Requires AW_REPO_TOKEN secret: fine-grained PAT with contents:write,
# actions:write, and metadata:read on awebai/aw.

on:
  push:
    tags:
      - 'aw-v*'

jobs:
  sync-to-aw:
    name: Sync cli/go to awebai/aw
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aweb
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#aw-v}" >> "$GITHUB_OUTPUT"

      # Before the push, not after: a stamp that names the wrong repository would ship a
      # binary whose commit resolves nowhere a reader looks, and the build would succeed.
      - name: Check the version stamp names the repository this pushes to
        run: ./scripts/check-aw-commit-repo-stamp.sh

      # aweb-aaun.13: goreleaser runs `go mod tidy` as a before hook in the derived repo, and
      # its hooks run AFTER its git-state validation - so an untidy manifest passes validation,
      # the hook rewrites go.mod and go.sum, and every binary is stamped vcs.modified=true on a
      # tree goreleaser has already called clean. That shipped across v1.32.10, v1.33.0, v1.34.0
      # and v1.34.1 before anyone opened a tarball.
      #
      # `make test` carries the same check, but nothing enforces a merge on it and a cancelled
      # run skips it silently - so on main it detects, and only here can it REFUSE. This is the
      # second check in this job to have teeth at the tag boundary; the stamp check above is the
      # first.
      #
      # ACCEPTED COST: this is the first Go dependency in this workflow, so setup-go flakiness
      # can now block a release. That failure is loud, attributable and re-runnable, which is
      # strictly better than a release that silently ships untraceable binaries.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod

      - name: Check the module manifest needs no rewriting at build time
        run: make check-cli-go-tidy

      - name: Push cli/go to awebai/aw
        env:
          AW_REPO_TOKEN: ${{ secrets.AW_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${AW_REPO_TOKEN}@github.com/awebai/aw.git" /tmp/aw-release
          cd /tmp/aw-release

          # Remove everything EXCEPT .git and .github (preserve aw's own workflows)
          find . -maxdepth 1 \
            -not -name '.' \
            -not -name '.git' \
            -not -name '.github' \
            -exec rm -rf {} +

          # Copy cli/go contents (this is the aw source)
          cp -a "$GITHUB_WORKSPACE/cli/go/." .

          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No code changes to sync"
          else
            git commit -m "Sync from awebai/aweb aw-v${VERSION}"
            git push origin main
          fi

          # Tag — the push triggers aw's release workflow
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
