name: Server Release (PyPI)

# Tag server-vX.Y.Z to publish the aweb package to PyPI.
# Uses PYPI_TOKEN secret (__token__ API token from pypi.org).
#
# PyPI never allows a version to be re-uploaded, so the aweb suite runs in this
# job, against the tree the tag points at, and the publish step below is only
# reached when it passes. The gate also produces server/dist, so what is
# uploaded is the build the suite ran beside rather than a second one.

on:
  push:
    tags:
      - 'server-v*'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The aweb suite talks to a real Postgres, as server-ci.yml does.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify version matches tag
        working-directory: server
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#server-v}"
          PKG_VERSION="$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"

      # Monotonicity (aweb-aaun.3). The step above proves the tag AGREES with the
      # manifest; it says nothing about whether either is newer than what shipped.
      # Those are different questions and only this one stops a tag republishing
      # or regressing a version on a surface PyPI will not let us take back.
      #
      # It resolves the predecessor with `git ls-remote`, so it needs no tags and
      # no history in the checkout - a local ref store reads empty under this
      # workflow's shallow clone, and a guard reading it would find no predecessor
      # exactly where it matters most.
      #
      # Placed before the suite deliberately: it is a two-second network call and
      # failing here costs nothing, where failing after the gate costs a full run.
      - name: Require the tag's version to be strictly newer than the last release
        run: ./scripts/check-release-tag-monotonic.sh server-v "$GITHUB_REF_NAME"

      - name: Gate the publish on the aweb suite at this commit
        run: make release-server-gate

      - name: Publish to PyPI
        working-directory: server
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
