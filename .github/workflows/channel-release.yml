name: Channel Release (npm)

# Tag channel-vX.Y.Z to publish @awebai/claude-channel to npm.
# Uses NPM_TOKEN secret (automation token from npmjs.com).

on:
  push:
    tags:
      - 'channel-v*'

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install channel-core dependencies
        working-directory: channel-core
        run: npm ci

      - name: Build channel-core
        working-directory: channel-core
        run: npm run build

      - name: Install dependencies
        working-directory: channel
        run: npm ci

      - name: Build
        working-directory: channel
        run: npm run build

      - name: Verify version matches tag
        working-directory: channel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#channel-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"

      - name: Pack and inspect the exact artifact
        run: |
          bash scripts/npm-exact-publish.sh pack-inspect \
            --dir channel --version "${GITHUB_REF_NAME#channel-v}" --out staged

      - name: Publish the exact staged bytes
        run: bash scripts/npm-exact-publish.sh publish-exact --tgz staged/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published equals staged
        run: |
          bash scripts/npm-exact-publish.sh verify-published --tgz staged/*.tgz \
            --package @awebai/claude-channel --version "${GITHUB_REF_NAME#channel-v}"
