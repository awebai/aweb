name: Test suite

# `make test` on every pull request and every push to main, so a release run
# can start from a CI-green main. This is the PR-time signal that the
# deleted comprehensive hosted gate used to provide as a side effect of running
# on pull requests too - at the cost of a ~120-minute job with a 54%
# cancellation rate, most of whose expensive half the focused workflows already
# cover (cli-e2e, federation-e2e and library-ci each run their Docker journey
# on pull requests). The complete proof runs locally in Docker through
# `make release-candidate TAGS='...'` before any publication tag exists.
#
# No Docker journeys: `make test` contains none, which is what makes this cheap.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-table-writes:
    name: Product table writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare product-table ceilings with the reviewed main baseline.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check product table writes
        run: make check-product-table-writes

  naapp-typecheck:
    name: naapp type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Type-check the naapp packages
        run: make typecheck-naapp

  extension-docs:
    name: Extension docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the private-infrastructure boundary
        run: make check-private-boundary

  commit-hook:
    name: Commit hook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
      - name: Commit unformatted files through the pre-commit hook
        run: make test-commit-hook

  test:
    name: Test suite
    needs: product-table-writes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI release-version derivation and the commit stamp check read
          # the full tag history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install tmux for the guarded launcher tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run Go, Python and Node suites without external network access
        run: make test-isolated
        env:
          TEST_EGRESS_EVIDENCE: ${{ runner.temp }}/test-egress

      - name: Run remaining test targets
        # These suites ran above on the isolated Docker network.
        run: make -o test-server -o test-awid -o test-cli -o test-channel -o test-channel-core -o test-pi-extension test

      - name: Preserve network isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-egress
          path: ${{ runner.temp }}/test-egress
