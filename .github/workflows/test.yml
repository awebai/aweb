name: Test suite

# `make test` on every pull request. This is the PR-time signal that the
# deleted comprehensive hosted gate used to provide as a side effect of running
# on pull requests too - at the cost of a ~120-minute job with a 54%
# cancellation rate, most of whose expensive half the focused workflows already
# cover (cli-e2e, federation-e2e and library-ci each run their Docker journey
# on pull requests). The complete proof runs locally in Docker through
# `make release-candidate TAGS='...'` before any publication tag exists.
#
# No Docker journeys: `make test` contains none, which is what makes this cheap.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A transaction-mode PgBouncer that drops the startup parameters pgdbm
      # requests, as Neon's pooler does. awid's database session tests run
      # through it (AWID_TEST_POOLER_URL).
      pgbouncer:
        image: edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_PREPARED_STATEMENTS: "0"
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path,jit,statement_timeout,lock_timeout,idle_in_transaction_session_timeout
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      REDIS_URL: redis://localhost:6379/0
      AWID_TEST_POOLER_URL: postgresql://postgres:postgres@localhost:6432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI release-version derivation and the commit stamp check read
          # the full tag history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install tmux for the guarded launcher tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run Go, Python and Node suites without external network access
        run: make test-isolated
        env:
          TEST_EGRESS_EVIDENCE: ${{ runner.temp }}/test-egress

      - name: Run remaining test targets
        # These suites ran above on the isolated Docker network.
        run: make -o test-server -o test-awid -o test-cli -o test-channel -o test-channel-name-live-contract -o test-channel-core -o test-pi-extension test

      - name: Preserve network isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-egress
          path: ${{ runner.temp }}/test-egress
