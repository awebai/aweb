name: Test suite

# Every existing test target remains covered. The four isolated groups run in
# parallel; the remaining source/packaging controls retain their native setup.
# The final stable check fails if either the matrix or remaining targets fail.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    name: Isolated (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server
            targets: test-server
          - suite: awid
            targets: test-awid
          - suite: cli
            targets: test-cli
          - suite: channel-pi
            targets: test-channel test-channel-name-live-contract test-channel-core test-pi-extension
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run isolated suites
        run: python3 scripts/test-egress/docker.py --evidence "${{ runner.temp }}/test-egress" ${{ matrix.targets }}
      - name: Preserve network isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-egress-${{ matrix.suite }}
          path: ${{ runner.temp }}/test-egress

  remaining:
    name: Remaining test targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A transaction-mode PgBouncer that drops the startup parameters pgdbm
      # requests, as Neon's pooler does. awid's database session tests run
      # through it (AWID_TEST_POOLER_URL).
      pgbouncer:
        image: edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_PREPARED_STATEMENTS: "0"
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path,jit,statement_timeout,lock_timeout,idle_in_transaction_session_timeout
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      REDIS_URL: redis://localhost:6379/0
      AWID_TEST_POOLER_URL: postgresql://postgres:postgres@localhost:6432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI release-version derivation and the commit stamp check read
          # the full tag history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install tmux for the guarded launcher tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run remaining test targets
        # These suites run in the isolated matrix jobs.
        run: make -o test-server -o test-awid -o test-cli -o test-channel -o test-channel-name-live-contract -o test-channel-core -o test-pi-extension test


  test:
    name: Test suite
    if: ${{ always() }}
    needs: [isolated, remaining]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        run: |
          test "${{ needs.isolated.result }}" = success
          test "${{ needs.remaining.result }}" = success
