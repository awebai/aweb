name: Fast repository checks

# Run four independent checks on pull requests and main. The full landing and
# release suites run through vm-gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-table-writes:
    name: Product table writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare product-table ceilings with the reviewed main baseline.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check product table writes
        run: make check-product-table-writes

  naapp-typecheck:
    name: naapp type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Type-check the naapp packages
        run: make typecheck-naapp

  extension-docs:
    name: Extension docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the private-infrastructure boundary
        run: make check-private-boundary

  commit-hook:
    name: Commit hook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
      - name: Commit unformatted files through the pre-commit hook
        run: make test-commit-hook
