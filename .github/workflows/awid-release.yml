name: Awid Release (GHCR)

# Tag awid-vX.Y.Z to publish the awid container image to GHCR.
#
# A tag can be moved but a consumer that already pulled it cannot be reached, so
# the awid suite runs in this job against the tree the tag points at and the
# build-and-push step below is only reached when it passes. That step is also
# the gate on the image itself: it cannot push an image that fails to build, and
# it is the only build covering both published platforms.

on:
  push:
    tags:
      - 'awid-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish awid image
    runs-on: ubuntu-latest

    # The awid suite creates real databases through the pgdbm fixtures.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Verify version matches tag
        working-directory: awid
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#awid-v}"
          PKG_VERSION="$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "AWID_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Gate the publish on the awid suite at this commit
        run: make release-awid-image-gate

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/awid
          tags: |
            type=raw,value=${{ env.AWID_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=awid
            org.opencontainers.image.description=Thin awid.ai registry service wrapper around aweb
            org.opencontainers.image.version=${{ env.AWID_VERSION }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: awid/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
