name: Reproducible release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-all-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-all-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
        with:
          # Version guards and CLI release derivation inspect the full tag history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install tmux for guarded launcher tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run the complete release gate
        run: make release-all-check
