            git tag -d "$tag" >/dev/null 2>&1 || true
            git tag "$tag" "$SOURCE_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "created tag $tag at $SOURCE_SHA"
              return
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true
            observed="$(remote_tag_sha "$tag")"
            [[ "$observed" == "$SOURCE_SHA" ]] \
              || fail "tag $tag conflicted at ${observed:-absent}"
            echo "adopted concurrent identical tag $tag"
          }

          tag="${TAG_PREFIX}${VERSION}"
          require_release_sha
          require_tag_compatible "$tag"

          dist="$RUNNER_TEMP/${PACKAGE}-dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          uv build --sdist --wheel --out-dir "$dist" "$PACKAGE_DIR"
          # uv build stamps a .gitignore into the out-dir it creates;
          # inspect-staged rightly refuses any extra file, so drop the stamp.
          rm -f "$dist/.gitignore"
          bash scripts/pypi-exact-publish.sh inspect-staged \
            --dist "$dist" --package "$PACKAGE" --version "$VERSION"

          require_release_sha
