name: Library CI

# Re-homed from naapp/library/.github/workflows/ci.yml. GitHub Actions reads
# .github/workflows only at the repository root, so after the subtree move that
# file sits below the root and never runs. This runs the same four steps - lint,
# AATK structural contract, unit and contract tests, real-stack e2e - against
# naapp/library.
#
# The job name is deliberately unchanged. It was the required status check
# "Lint, test, and real-stack e2e" on library main, so keeping the name means a
# reader comparing the two finds the same string rather than guessing at a
# rename.
#
# THIS GATE IS ADVISORY HERE, AND THE SAME-NAMED ONE ELSEWHERE IS NOT. Measured
# 2026-07-30 (aweb-aavw criterion 4):
#
#   awebai/aweb     main NOT protected - the protection endpoint returns 404
#                   "Branch not protected", there are no rulesets, and
#                   branches/main reports protected=false. aweb main is the
#                   shared sync branch and cannot be protected.
#   awebai/library  main IS protected, still, with an admin-enforced required
#                   check of THIS EXACT NAME:
#                     required_status_checks ["Lint, test, and real-stack e2e"]
#                     enforce_admins true, strict true
#
# So the string is identical on purpose and only one of the two is enforced. A
# reader who finds this job and assumes it blocks a merge here would be wrong;
# one who assumes the name is a coincidence would also be wrong.
#
# NO PATH FILTER, deliberately. Every path-filtered workflow in this repo
# omitted naapp from its path list, which is how library's coverage went
# missing in the first place. The cost is that a docker e2e runs on every pull
# request, preferred over a gate that can be silently skipped.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBRARY_REQUIRE_TEST_DATABASE: "1"

concurrency:
  group: library-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and real-stack e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # One checkout, no `path:`. The pinned external aweb checkout the previous
      # workflow needed is gone: aweb IS this repository now, so the e2e stack
      # builds awid from the very commit under test rather than from a rev that
      # stops matching the moment someone edits awid/.
      - name: Checkout aweb
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: naapp/library/uv.lock

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install locked Library dependencies
        working-directory: naapp/library
        run: uv sync --locked

      - name: Build aw from the checkout
        run: |
          make -C cli/go build
          echo "$GITHUB_WORKSPACE/cli/go" >> "$GITHUB_PATH"

      - name: Check the e2e aw build
        run: bash scripts/check-naapp-e2e-aw.sh

      - name: Lint and type-check
        working-directory: naapp/library
        run: make lint

      - name: Validate AATK structural contract
        working-directory: naapp/library
        run: make aatk-spec-check

      - name: Run unit and contract tests
        working-directory: naapp/library
        run: make test

      # docker-compose.e2e.yml builds the awid service from
      # ${LIBRARY_E2E_AWEB_CONTEXT:-../..}, the repository root. The explicit
      # workspace path names the same directory, so the e2e exercises in-repo
      # awid.
      - name: Run real-stack e2e
        working-directory: naapp/library
        env:
          LIBRARY_E2E_AWEB_CONTEXT: ${{ github.workspace }}
        run: make e2e

  # naapp-lib is tested here rather than in its own workflow because it is an
  # in-repo dependency of BOTH movers - naapp/library and naapp/folio each
  # declare aweb-naapp - and it shares this workflow's trigger. It is not part
  # of the Library service; it had no CI of its own before the move, and leaving
  # it uncovered in a repo that has CI would have been an oversight rather than
  # a decision (aweb-aavw criterion 5).
  #
  # The shared runtime has its own real PostgreSQL and browser tests. Keep it
  # independent of the Library e2e stack and its 40-minute timeout.
  naapp-lib:
    name: naapp-lib lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAAPP_REQUIRE_TEST_DATABASE: "1"
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout aweb
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: naapp-lib/uv.lock

      - name: Install locked dependencies
        working-directory: naapp-lib
        run: uv sync --locked

      - name: Install the runtime test browser
        working-directory: naapp-lib
        run: uv run --no-sync playwright install --with-deps --only-shell chromium

      - name: Lint and type-check
        working-directory: naapp-lib
        run: |
          uv run ruff check .
          uv run mypy src

      - name: Run tests
        working-directory: naapp-lib
        run: uv run pytest -q
