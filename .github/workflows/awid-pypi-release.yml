name: Awid Service Release (PyPI)

# Tag awid-service-vX.Y.Z to publish the awid-service package to PyPI.
# Uses PYPI_TOKEN secret (__token__ API token from pypi.org).
#
# PyPI never allows a version to be re-uploaded, and awid has already burned two
# versions this way, so the awid suite runs in this job against the tree the tag
# points at and the publish step below is only reached when it passes. The gate
# also produces awid/dist, so what is uploaded is the build the suite ran beside
# rather than a second one.

on:
  push:
    tags:
      - 'awid-service-v*'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The awid suite creates real databases through the pgdbm fixtures.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify version matches tag
        working-directory: awid
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#awid-service-v}"
          PKG_VERSION="$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"

      - name: Gate the publish on the awid suite at this commit
        run: make release-awid-pypi-gate

      - name: Publish to PyPI
        working-directory: awid
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
