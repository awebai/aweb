name: Dependency Audit

# Fail when a Node production dependency carries a published advisory
# (default-aajc.14, Track 1). Kept separate from the Freshness workflow because
# this is a security posture check against an external advisory database, not a
# drift check against sources in the repository — it can turn red without any
# change to this repo, which is the point.
#
# Scope: shipped Node dependencies plus reachable Go findings under the exact
# toolchain pinned by go.mod and the production gateway image. Python server/awid
# lock findings are routed to the teams owning those deploys.

on:
  push:
    branches: [main]
  pull_request:
  # The advisory database changes independently of this repository, so a
  # push/PR-only trigger would leave a newly published advisory against an
  # UNCHANGED dependency unnoticed until somebody happened to push. That defeats
  # the stated purpose of this workflow — it exists precisely to turn red without
  # a change here.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Install so each package's lockfile resolves; the audit reads the
      # dependency tree, and channel-core is a file: dependency of the other two.
      - name: Install channel-core deps
        working-directory: channel-core
        run: npm ci

      - name: Install channel deps
        working-directory: channel
        run: npm ci

      - name: Install pi-extension deps
        working-directory: pi-extension
        run: npm ci

      # The self-test runs FIRST and proves the gate can still fail. Without it
      # an audit job that silently stopped detecting anything would look
      # identical to a clean tree (default-aajc.16 established this standard).
      - name: Prove the audit gate can fail
        run: bash scripts/check-node-audit.sh --self-test

      - name: Audit Node production dependencies
        run: bash scripts/check-node-audit.sh

  go-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      # Prove new reachable IDs, stale/expired exceptions, non-symbol scans,
      # and source/container/scanner toolchain drift all turn the gate red.
      - name: Prove the Go audit gate can fail
        run: python3 scripts/test_check_go_vulnerability_audit.py

      - name: Audit reachable Go vulnerabilities under the shipped toolchain
        env:
          AW_GO_VULN_OUTPUT: ${{ runner.temp }}/govulncheck.json
        run: bash scripts/check-go-vulnerability-audit.sh

      - name: Archive govulncheck output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: govulncheck-${{ github.sha }}
          path: ${{ runner.temp }}/govulncheck.json
          if-no-files-found: warn
