name: Dependency Audit

# Fail when a Node production dependency carries a published advisory
# (default-aajc.14, Track 1). Kept separate from the Freshness workflow because
# this is a security posture check against an external advisory database, not a
# drift check against sources in the repository — it can turn red without any
# change to this repo, which is the point.
#
# Scope: Node only. The Go toolchain advisories are default-aall; the Python
# server/awid lock findings are routed to the teams owning those deploys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Install so each package's lockfile resolves; the audit reads the
      # dependency tree, and channel-core is a file: dependency of the other two.
      - name: Install channel-core deps
        working-directory: channel-core
        run: npm ci

      - name: Install channel deps
        working-directory: channel
        run: npm ci

      - name: Install pi-extension deps
        working-directory: pi-extension
        run: npm ci

      # The self-test runs FIRST and proves the gate can still fail. Without it
      # an audit job that silently stopped detecting anything would look
      # identical to a clean tree (default-aajc.16 established this standard).
      - name: Prove the audit gate can fail
        run: bash scripts/check-node-audit.sh --self-test

      - name: Audit Node production dependencies
        run: bash scripts/check-node-audit.sh
