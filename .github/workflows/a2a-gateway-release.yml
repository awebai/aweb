name: A2A Gateway Release (GHCR)

# Tag a2a-gw-vX.Y.Z to publish the hosted A2A gateway image to GHCR.

on:
  push:
    tags:
      - 'a2a-gw-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish A2A gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#a2a-gw-v}"
          PKG_VERSION="$(python3 -c "
          import re
          text = open('server/pyproject.toml').read()
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match server/pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "A2A_GW_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "A2A_GW_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "A2A_GW_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "A2A_GW_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/a2a-gateway
          tags: |
            type=raw,value=${{ env.A2A_GW_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=aweb A2A Gateway
            org.opencontainers.image.description=Hosted A2A gateway for aweb agents
            org.opencontainers.image.version=${{ env.A2A_GW_VERSION }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: cli/go
          file: cli/go/Dockerfile.a2a-gw
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.A2A_GW_VERSION }}
            RELEASE_TAG=${{ env.A2A_GW_RELEASE_TAG }}
            COMMIT=${{ env.A2A_GW_COMMIT }}
            COMMIT_REPO=github.com/${{ github.repository }}
            DATE=${{ env.A2A_GW_DATE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
