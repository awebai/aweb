name: Server CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-ci.yml"
      - "server/**"
      - "scripts/check-server-version-bump.sh"
      - "scripts/check-server-version-bump-test.sh"
  pull_request:
    paths:
      - ".github/workflows/server-ci.yml"
      - "server/**"
      - "scripts/check-server-version-bump.sh"
      - "scripts/check-server-version-bump-test.sh"

jobs:
  version-bump-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard diffs against the last server-v* tag, so it needs
          # full history and tags.
          fetch-depth: 0

      - name: Guard scenario self-test
        run: ./scripts/check-server-version-bump-test.sh

      - name: Require version bump for server changes
        run: ./scripts/check-server-version-bump.sh

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        working-directory: server
        run: uv build

      - name: Smoke test installed wheel
        working-directory: server
        run: |
          python -m venv /tmp/aweb-wheel-smoke
          /tmp/aweb-wheel-smoke/bin/pip install dist/*.whl
          /tmp/aweb-wheel-smoke/bin/aweb --help

      - name: Run server test suite
        working-directory: server
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: uv run pytest

      - name: Validate compose file
        working-directory: server
        env:
          POSTGRES_PASSWORD: testpass
        run: docker compose config
