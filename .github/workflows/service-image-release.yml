name: Publish service image

on:
  push:
    tags: ["server-v*", "awid-v*"]
  # Publishes an existing tag's image again with main's publisher, for a tag
  # whose own run could not publish it. The image is built from the tag's commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (server-v*, awid-v*)"
        required: true
        type: string
      first_publication:
        description: "An image repository this run creates (e.g. ghcr.io/awebai/aweb-server); empty for none"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Install registry client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish or adopt the tagged image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          FIRST_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.first_publication || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "image recovery runs main's publisher; dispatched from $GITHUB_REF" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "no release tag $RELEASE_TAG" >&2
            exit 1
          fi
          # A dispatch is a recovery of an existing tag's image: it never moves latest.
          recovery=()
          [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] || recovery=(--recovery)
          # A new repository is created only by an explicit dispatch input, never inferred.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "${FIRST_PUBLICATION:-}" ]]; then
            recovery+=(--first-publication "$FIRST_PUBLICATION")
          fi
          python3 scripts/publish_release.py --only oci "${recovery[@]}" "$RELEASE_TAG"
