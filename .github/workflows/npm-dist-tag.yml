name: Point an npm dist-tag at an exact version

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name, e.g. @awebai/aw"
        required: true
      tag:
        description: "Dist-tag to set, e.g. next"
        required: true
      version:
        description: "Exact published version the tag will point to"
        required: true

permissions:
  contents: read

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Set the dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^[a-z][a-z0-9-]*$'
          test "$TAG" != latest
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          npm view "$PACKAGE@$VERSION" version
          npm dist-tag add "$PACKAGE@$VERSION" "$TAG"
          npm view "$PACKAGE" dist-tags
