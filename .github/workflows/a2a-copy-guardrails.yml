name: A2A Copy Guardrails

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a2a-copy-guardrails.yml"
      - "docs/**"
      - "skills/**"
      - ".claude/skills/**"
      - "channel/skills/**"
      - "packages/claude-skills/skills/**"
      - "packages/codex-plugin/skills/**"
      - "pi-extension/skills/**"
      - "cli/go/cmd/aw/**"
      - "scripts/check-a2a-copy-guardrails.sh"
  pull_request:
    paths:
      - ".github/workflows/a2a-copy-guardrails.yml"
      - "docs/**"
      - "skills/**"
      - ".claude/skills/**"
      - "channel/skills/**"
      - "packages/claude-skills/skills/**"
      - "packages/codex-plugin/skills/**"
      - "pi-extension/skills/**"
      - "cli/go/cmd/aw/**"
      - "scripts/check-a2a-copy-guardrails.sh"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check A2A copy guardrails
        run: ./scripts/check-a2a-copy-guardrails.sh
