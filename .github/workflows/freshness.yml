name: Freshness

# Regenerate every intentionally committed generated artifact (uv locks, cli
# reference, reserved-app-ids, resource packs, and the claude-channel + pi
# bundles) and fail on drift, so stale committed metadata is caught mechanically
# instead of by reviewer inspection (default-aajc.5).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install channel-core deps
        working-directory: channel-core
        run: npm ci

      - name: Install channel deps
        working-directory: channel
        run: npm ci

      - name: Install pi-extension deps
        working-directory: pi-extension
        run: npm ci

      - name: Freshness gate
        run: bash scripts/check-freshness.sh

  # The freshness gate proves a clean bundle still carries the security surface,
  # but it does not exercise the verifier or pin store behaviorally. This job
  # runs the TypeScript/JS suites so a regression in the DID-log verifier, the
  # fail-closed pin store, or the mail presentation-ack path fails CI directly
  # (default-aajc.5 follow-up) — the security fixes now have a running gate, not
  # only a static marker check.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install channel-core deps
        working-directory: channel-core
        run: npm ci

      - name: Install channel deps
        working-directory: channel
        run: npm ci

      - name: Install pi-extension deps
        working-directory: pi-extension
        run: npm ci

      - name: channel-core suite
        working-directory: channel-core
        run: npm test

      - name: channel suite
        working-directory: channel
        run: npm test

      - name: pi-extension suite
        working-directory: pi-extension
        run: npm test

  # The Go unit suites were not executed by ANY workflow: CI ran only
  # `go test -tags e2e ./e2e` via cli-e2e. So every Go-side security test in the
  # aajc epic — forged-rotation refusal, address-takeover refusal, the
  # anti-rollback checkpoint, the read bounds — was ungated, while the
  # TypeScript mirrors of the same checks were gated by the job above
  # (default-aajc.15).
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod

      - name: Go unit suites
        working-directory: cli/go
        run: go test ./... -count=1

  # Separate job because the race detector is the instrument that validates the
  # concurrency classes this audit found, and it must be able to fail on its own
  # rather than being masked by an unrelated failure in the plain run. Scoped to
  # the packages that hold concurrent code; no blanket exclusions within them.
  go-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod

      - name: Race detector
        working-directory: cli/go
        run: go test -race ./awid/ ./run/ ./cmd/aw/ ./internal/conformance/ -count=1
