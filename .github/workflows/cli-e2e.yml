name: CLI e2e (profile/team/Library)

# Real-stack profile/team/Library e2e net (default-aabq.4, part 2). Brings up the
# awid + aweb + Library docker-compose stack from source, seeds the current
# aweb.team catalog blueprint, and runs the AW_E2E suite driving the REAL aw
# binary against the live services. This is the blocking gate that catches the
# materialize/team/Library regressions hermetic unit tests miss (the class of
# P0s that shipped on
# green-plus-reviewer-ACK).
#
# It needs the two sibling checkouts the stack builds from / seeds:
#   awebai/library      (public) -> Library service build context
#   awebai/blueprints   (public) -> the aweb.team blueprint the seed publishes
# Both are public, so the default GITHUB_TOKEN can clone them.

on:
  pull_request:
    paths:
      - "cli/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.e2e.cache.yml"
      - "scripts/e2e-library-stack.sh"
      - "scripts/e2e/**"
      - "awid/**"
      - "server/**"
      - ".github/workflows/cli-e2e.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.e2e.cache.yml"
      - "scripts/e2e-library-stack.sh"
      - "scripts/e2e/**"
      - "awid/**"
      - "server/**"
      - ".github/workflows/cli-e2e.yml"

concurrency:
  group: cli-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-e2e:
    name: CLI real-stack e2e
    runs-on: ubuntu-latest
    # Headroom over the cold-runner build + sequential health waits so a slow run
    # completes instead of timing out (a timeout reads as a build failure). The
    # buildx GHA layer cache below keeps warm runs well under this. (aabq.33)
    timeout-minutes: 40
    steps:
      - name: Checkout aweb
        uses: actions/checkout@v7
        with:
          path: aweb

      - name: Checkout library
        uses: actions/checkout@v7
        with:
          repository: awebai/library
          path: library

      - name: Checkout blueprints
        uses: actions/checkout@v7
        with:
          repository: awebai/blueprints
          path: blueprints

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aweb/cli/go/go.mod
          # The Go module lives at cli/go; point the build/module cache at its
          # go.sum so `make build` reuses modules and compiled packages.
          cache-dependency-path: aweb/cli/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # GitHub runners share IPs and hit Docker Hub's anonymous pull limits, which
      # fails the stack's postgres/redis pulls and the python:3.12-slim base in the
      # awid/aweb/library builds. Route docker.io through Google's pull-through
      # mirror (no auth, no rate limit) so every docker.io pull is covered.
      - name: Route Docker Hub pulls through a mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # A buildx builder is required for the type=gha layer cache (the default
      # docker driver cannot export to it). The builder container does not
      # inherit the daemon's registry mirror, so configure the same mirror here
      # for the base-image pulls inside the awid/aweb/library builds.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # buildx's type=gha cache backend reads ACTIONS_RUNTIME_TOKEN and
      # ACTIONS_CACHE_URL from the environment. GitHub exposes those to actions
      # (docker/build-push-action populates them automatically) but NOT to a
      # plain `run:` step - and our build runs inline via `make ... e2e` ->
      # compose bake. Export them so cache_to/cache_from: type=gha can configure.
      - name: Expose GitHub Actions runtime for the buildx GHA cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Run CLI real-stack e2e
        working-directory: aweb
        env:
          # The stack auto-resolves siblings, but in CI the repos are checked out
          # under explicit paths, so point at them directly.
          LIBRARY_E2E_LIBRARY_CONTEXT: ${{ github.workspace }}/library
          LIBRARY_E2E_BLUEPRINT_SRC: ${{ github.workspace }}/blueprints/team
          # Route `compose up --build` through buildx bake so the overlay's
          # type=gha cache_from/cache_to are honored, and apply that CI-only
          # overlay so awid/aweb/library builds use the GHA layer cache.
          COMPOSE_BAKE: "true"
          LIBRARY_E2E_COMPOSE_OVERLAY: ${{ github.workspace }}/aweb/docker-compose.e2e.cache.yml
          # Pin the bake build to the buildx (docker-container) builder; the
          # default docker driver cannot export a cache, so compose+bake must
          # target this builder explicitly rather than the default.
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: make -C cli e2e
