name: AWID Image Release

# The complete release gate already passed before the release branch moved.
# This workflow rebuilds that exact commit once, publishes/adopts its immutable
# index plus latest, and verifies the public digest and publication tag.
on:
  push:
    branches: [release]

permissions:
  contents: write
  packages: write

concurrency:
  group: awid-image-release
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  publish_image:
    name: Publish two-platform AWID image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Install registry client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Derive AWID version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("awid/pyproject.toml", "rb"))["project"]["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate derived AWID identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/npm-exact-publish.sh validate-inputs --sha "$SOURCE_SHA" --version "$VERSION"

      - name: Build once, publish or adopt, verify digest, and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { printf 'REFUSE: %s\n' "$1" >&2; exit 1; }
          remote_tag_sha() {
            local tag="$1" lines direct peeled
            lines="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
            direct="$(awk '$2 !~ /\^\{\}$/ {print $1}' <<<"$lines" | head -1)"
            peeled="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$lines" | head -1)"
            printf '%s\n' "${peeled:-$direct}"
          }
          require_release_sha() {
            local release_tip
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/release:refs/remotes/origin/release
            release_tip="$(git ls-remote origin refs/heads/release | awk '{print $1}')"
            [[ "$release_tip" == "$SOURCE_SHA" ]] \
              || fail "github.sha $SOURCE_SHA is not the exact remote release tip ${release_tip:-absent}"
            [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] \
              || fail "checkout is not github.sha $SOURCE_SHA"
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main \
              || fail "release SHA $SOURCE_SHA is not an ancestor of main"
          }
          require_tag_compatible() {
            local tag="$1" observed
            observed="$(remote_tag_sha "$tag")"
            [[ -z "$observed" || "$observed" == "$SOURCE_SHA" ]] \
              || fail "tag $tag exists at $observed, not $SOURCE_SHA"
          }
          publish_tag() {
            local tag="$1" observed
            observed="$(remote_tag_sha "$tag")"
            if [[ "$observed" == "$SOURCE_SHA" ]]; then
              echo "adopted existing tag $tag at $SOURCE_SHA"
              return
            fi
            [[ -z "$observed" ]] || fail "tag $tag moved to $observed"
            git tag -d "$tag" >/dev/null 2>&1 || true
            git tag "$tag" "$SOURCE_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "created tag $tag at $SOURCE_SHA"
              return
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true
            observed="$(remote_tag_sha "$tag")"
            [[ "$observed" == "$SOURCE_SHA" ]] \
              || fail "tag $tag conflicted at ${observed:-absent}"
            echo "adopted concurrent identical tag $tag"
          }

          tag="awid-v${VERSION}"
          require_release_sha
          require_tag_compatible "$tag"

          staging="$RUNNER_TEMP/awid-image"
          rm -rf "$staging"
          mkdir -p "$staging"
          docker buildx build \
            --file awid/Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.title=awid" \
            --label "org.opencontainers.image.description=Thin awid.ai registry service wrapper around aweb" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --output "type=oci,dest=$staging/awid-oci.tar" \
            .
          bash scripts/oci-exact-publish.sh inspect-staged \
            --archive "$staging/awid-oci.tar" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --out "$staging/identities.json"
          staged="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["index"])' "$staging/identities.json")"
          printf 'STAGED INDEX DIGEST: %s\n' "$staged" | tee -a "$GITHUB_STEP_SUMMARY"

          require_release_sha
          echo "$GHCR_TOKEN" | timeout 30 skopeo login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          listing_status=ok
          if ! tags_json="$(timeout 30 skopeo list-tags docker://ghcr.io/awebai/awid)"; then
            listing_status=failed
            tags_json='{}'
          fi
          [[ "$listing_status" == ok ]] \
            || fail "GHCR tag listing unavailable; observation failure is never absence"

          for image_tag in "$VERSION" latest; do
            present="$(printf '%s' "$tags_json" \
              | bash scripts/oci-exact-publish.sh classify-listing --tag "$image_tag")"
            remote_digest=unavailable
            if [[ "$present" == yes ]]; then
              if ! remote_digest="$(timeout 30 skopeo inspect --raw \
                "docker://ghcr.io/awebai/awid:${image_tag}" \
                | bash scripts/oci-exact-publish.sh observe-digest)"; then
                fail "GHCR digest unavailable for present tag $image_tag"
              fi
            fi
            kind=version
            [[ "$image_tag" == latest ]] && kind=latest
            action="$(bash scripts/oci-exact-publish.sh decide-tag \
              --tag-kind "$kind" --staged "$staged" \
              --listing-status "$listing_status" --present "$present" \
              --remote-digest "$remote_digest")"
            case "$action" in
              ADOPT) echo "adopted ghcr.io/awebai/awid:${image_tag} at $staged" ;;
              COPY)
                skopeo copy --all "oci-archive:$staging/awid-oci.tar" \
                  "docker://ghcr.io/awebai/awid:${image_tag}" ;;
              *) fail "unexpected registry decision $action" ;;
            esac
          done

          bash scripts/oci-exact-publish.sh verify-published \
            --archive "$staging/awid-oci.tar" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --repository ghcr.io/awebai/awid
          require_release_sha
          publish_tag "$tag"
          printf 'IMMUTABLE INDEX: ghcr.io/awebai/awid:%s@%s\n' \
            "$VERSION" "$staged" | tee -a "$GITHUB_STEP_SUMMARY"
