name: npm and Skills Release

# Expensive suites already passed in the clean local gate. This workflow
# rebuilds the exact release tip, publishes/adopts exact public bytes, and
# verifies registry and GitHub Release state without a second suite run.
on:
  push:
    branches: [release]
    paths:
      - "channel/**"
      - "channel-core/**"
      - "pi-extension/**"
      - "packages/claude-skills/**"
      - "packages/claude-ai-skills/**"
      - "skills/aweb-bootstrap/**"
      - "skills/aweb-coordination/**"
      - "skills/aweb-identity/**"
      - "skills/aweb-messaging/**"
      - "skills/aweb-team-membership/**"

permissions:
  contents: write

env:
  SOURCE_SHA: ${{ github.sha }}
  DEFAULT_SKILLS: aweb-bootstrap aweb-coordination aweb-identity aweb-messaging aweb-team-membership

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [channel, pi, skills]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve committed package identity
        id: lane
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            channel) dir=channel; npm_name=@awebai/claude-channel; tag_prefix=channel-v ;;
            pi) dir=pi-extension; npm_name=@awebai/pi; tag_prefix=pi-v ;;
            skills) dir=packages/claude-skills; npm_name=@awebai/claude-skills; tag_prefix=skills-v ;;
          esac
          version="$(node -p "require('./$dir/package.json').version")"
          bash scripts/npm-exact-publish.sh validate-inputs --sha "$SOURCE_SHA" --version "$version"
          printf 'dir=%s\nnpm_name=%s\ntag_prefix=%s\nversion=%s\n' \
            "$dir" "$npm_name" "$tag_prefix" "$version" >> "$GITHUB_OUTPUT"

      - name: Verify exact source and canonical bundle identities
        env:
          PACKAGE: ${{ matrix.package }}
          DIR: ${{ steps.lane.outputs.dir }}
          VERSION: ${{ steps.lane.outputs.version }}
        run: |
          set -euo pipefail
          fail() { printf 'REFUSE: %s\n' "$1" >&2; exit 1; }
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release:refs/remotes/origin/release
          release_tip="$(git ls-remote origin refs/heads/release | awk '{print $1}')"
          [[ "$release_tip" == "$SOURCE_SHA" ]] \
            || fail "github.sha $SOURCE_SHA is not exact remote release tip ${release_tip:-absent}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main \
            || fail "release SHA is not an ancestor of main"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || fail "checkout SHA mismatch"

          if [[ "$PACKAGE" == channel || "$PACKAGE" == pi ]]; then
            digest="$(git archive "$SOURCE_SHA" channel-core | sha256sum | awk '{print $1}')"
            echo "channel-core source bundle: $digest"
          fi
          if [[ "$PACKAGE" == pi || "$PACKAGE" == skills ]]; then
            paths=()
            for skill in $DEFAULT_SKILLS; do paths+=("skills/$skill"); done
            digest="$(git archive "$SOURCE_SHA" "${paths[@]}" | sha256sum | awk '{print $1}')"
            echo "canonical skills source bundle: $digest"
          fi
          if [[ "$PACKAGE" == channel || "$PACKAGE" == skills ]]; then
            plugin="$(node -p "require('./$DIR/.claude-plugin/plugin.json').version")"
            [[ "$plugin" == "$VERSION" ]] \
              || fail "committed plugin version $plugin does not equal package $VERSION"
            echo "committed plugin version equals package version"
          fi

      - name: Build release bytes without suites
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            channel)
              (cd channel-core && npm ci --no-audit --no-fund && npm run build)
              (cd channel && npm ci --no-audit --no-fund && npm run build) ;;
            pi)
              (cd channel-core && npm ci --no-audit --no-fund && npm run build)
              (cd pi-extension && npm ci --no-audit --no-fund && npm run build) ;;
            skills)
              (cd packages/claude-skills && npm run sync-skills)
              (cd packages/claude-ai-skills && ./build-zips.sh) ;;
          esac

      - name: Pack once and inspect declared content
        env:
          PACKAGE: ${{ matrix.package }}
          DIR: ${{ steps.lane.outputs.dir }}
          VERSION: ${{ steps.lane.outputs.version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/$PACKAGE-staging"
          mkdir -p "$staging"
          bash scripts/npm-exact-publish.sh pack-inspect \
            --dir "$DIR" --version "$VERSION" --out "$staging" \
            --profile "$PACKAGE" --source-root .
          if [[ "$PACKAGE" == channel || "$PACKAGE" == skills ]]; then
            echo "packed plugin version equals package version"
          fi
          if [[ "$PACKAGE" == skills ]]; then
            cp packages/claude-ai-skills/dist/*.zip "$staging/"
            export EXPECTED_ZIPS="aweb-bootstrap.zip aweb-coordination.zip aweb-identity.zip aweb-messaging.zip aweb-team-membership.zip"
            python3 - "$staging" <<'PY'
          import os, sys, zipfile
          staging = sys.argv[1]
          expected = set(os.environ["EXPECTED_ZIPS"].split())
          actual = {name for name in os.listdir(staging) if name.endswith(".zip")}
          if actual != expected:
              raise SystemExit(f"REFUSE: ZIP set {sorted(actual)} != {sorted(expected)}")
          for name in expected:
              skill = name[:-4]
              source = os.path.join("skills", skill)
              wanted = {}
              for base, _, files in os.walk(source):
                  for filename in files:
                      path = os.path.join(base, filename)
                      wanted[os.path.relpath(path, source)] = open(path, "rb").read()
              with zipfile.ZipFile(os.path.join(staging, name)) as archive:
                  observed = {entry: archive.read(entry) for entry in archive.namelist() if not entry.endswith("/")}
              if observed != wanted:
                  raise SystemExit(f"REFUSE: {name} bytes differ from canonical skill source")
          print("exact five skill ZIP names and bytes verified")
          PY
          fi

      - name: Publish or adopt exact public bytes and output tags
        env:
          PACKAGE: ${{ matrix.package }}
          DIR: ${{ steps.lane.outputs.dir }}
          NPM_NAME: ${{ steps.lane.outputs.npm_name }}
          TAG_PREFIX: ${{ steps.lane.outputs.tag_prefix }}
          VERSION: ${{ steps.lane.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { printf 'REFUSE: %s\n' "$1" >&2; exit 1; }
          # remote_tag_sha comes from the one shared implementation.
          source scripts/release-tag-helpers.sh
          require_release_sha() {
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/release:refs/remotes/origin/release
            release_tip="$(git ls-remote origin refs/heads/release | awk '{print $1}')"
            [[ "$release_tip" == "$SOURCE_SHA" ]] || fail "remote release tip moved"
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main || fail "release SHA left main"
          }
          require_tag_compatible() {
            observed="$(remote_tag_sha "$1")"
            [[ -z "$observed" || "$observed" == "$SOURCE_SHA" ]] \
              || echo "version tag $1 remains at its earlier byte-identical source $observed"
          }
          publish_tag() {
            tag="$1"; observed="$(remote_tag_sha "$tag")"
            if [[ "$observed" == "$SOURCE_SHA" ]]; then echo "adopted tag $tag"; return; fi
            if [[ -n "$observed" ]]; then
              echo "retained existing tag $tag at byte-identical source $observed"
              return
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true
            git tag "$tag" "$SOURCE_SHA"
            if git push origin "refs/tags/$tag"; then echo "created tag $tag"; return; fi
            git tag -d "$tag" >/dev/null 2>&1 || true
            [[ "$(remote_tag_sha "$tag")" == "$SOURCE_SHA" ]] \
              || fail "tag $tag conflicted"
          }

          tag="${TAG_PREFIX}${VERSION}"
          require_release_sha
          require_tag_compatible "$tag"
          staging="$RUNNER_TEMP/$PACKAGE-staging"
          tgz="$(find "$staging" -maxdepth 1 -name '*.tgz' -type f)"
          [[ -f "$tgz" ]] || fail "exactly one packed tgz is required"
          staged_digest="$(sha256sum "$tgz" | awk '{print $1}')"
          encoded="$(node -p "encodeURIComponent(process.env.NPM_NAME)")"
          status=000
          if ! status="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o "$RUNNER_TEMP/$PACKAGE-observed.json" -w '%{http_code}' \
            "https://registry.npmjs.org/${encoded}/${VERSION}")"; then
            fail "npm registry unavailable; unavailable is never absence"
          fi
          observed_args=()
          if [[ "$status" == 200 ]]; then
            tarball="$(node -e "const d=require(process.argv[1]); if(!d.dist?.tarball) process.exit(1); console.log(d.dist.tarball)" "$RUNNER_TEMP/$PACKAGE-observed.json")" \
              || fail "present npm version has malformed evidence"
            curl -fsSL --connect-timeout 15 --max-time 30 -o "$RUNNER_TEMP/$PACKAGE-observed.tgz" "$tarball" \
              || fail "present npm tarball unavailable"
            observed_args=(--observed "$(sha256sum "$RUNNER_TEMP/$PACKAGE-observed.tgz" | awk '{print $1}')")
          fi
          decision="$(bash scripts/npm-exact-publish.sh decide-npm \
            --observed-status "$status" --digest "$staged_digest" "${observed_args[@]}")"

          if [[ "$PACKAGE" == pi && "$decision" == PUBLISH ]]; then
            # PI_AW_FLOOR_BEGIN - the fixture executes this exact block.
            intended_floor="$(node -p "require('./pi-extension/package.json').dependencies['@awebai/aw']")"
            [[ "$intended_floor" =~ ^\^([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
              || fail "Pi aw floor must be one literal caret version"
            floor="${BASH_REMATCH[1]}"
            AW_FLOOR_MOVED=yes
            root_status="$(curl -sS --connect-timeout 15 --max-time 30 \
              -o "$RUNNER_TEMP/pi-packument.json" -w '%{http_code}' \
              "https://registry.npmjs.org/${encoded}")" || fail "Pi registry history unavailable"
            if [[ "$root_status" == 200 ]]; then
              if ! previous="$(node - <<'NODE' "$RUNNER_TEMP/pi-packument.json"
          const doc=require(process.argv[2]);
          const latest=doc['dist-tags']?.latest;
          if (!latest || !doc.versions?.[latest]) process.exit(1);
          process.stdout.write(doc.versions[latest].dependencies?.['@awebai/aw'] || '');
          NODE
              )"; then
                fail "Pi registry history evidence is malformed"
              fi
              [[ "$previous" == "$intended_floor" ]] && AW_FLOOR_MOVED=no
            elif [[ "$root_status" == 401 || "$root_status" == 403 ]]; then
              fail "Pi registry history authorization failed (HTTP $root_status)"
            elif [[ "$root_status" != 404 ]]; then
              fail "Pi registry history unavailable (HTTP $root_status)"
            fi
            if [[ "$AW_FLOOR_MOVED" == yes ]]; then
              aw_deadline=$((SECONDS + ${PI_AW_FLOOR_TIMEOUT_SECONDS:-600}))
              while :; do
                aw_status="$(curl -sS --connect-timeout 15 --max-time 30 \
                  -o "$RUNNER_TEMP/aw-floor.json" -w '%{http_code}' \
                  "https://registry.npmjs.org/%40awebai%2Faw/${floor}")" \
                  || fail "public aw floor observation unavailable"
                case "$aw_status" in
                  200)
                    if ! observed_aw="$(node -p "require('$RUNNER_TEMP/aw-floor.json').version")"; then
                      fail "public aw floor evidence is malformed"
                    fi
                    [[ "$observed_aw" == "$floor" ]] || fail "public aw floor evidence mismatch"
                    break ;;
                  404)
                    (( SECONDS < aw_deadline )) || fail "public aw floor $floor propagation deadline exceeded"
                    echo "waiting for public aw floor $floor"
                    sleep "${PI_AW_FLOOR_BACKOFF_SECONDS:-5}" ;;
                  401|403) fail "public aw floor observation authorization failed (HTTP $aw_status)" ;;
                  *) fail "public aw floor observation unavailable (HTTP $aw_status)" ;;
                esac
              done
            fi
            # PI_AW_FLOOR_END
          fi

          require_release_sha
          case "$decision" in
            ADOPT) action=adopt ;;
            PUBLISH)
              bash scripts/npm-exact-publish.sh publish-exact --tgz "$tgz"
              action=publish ;;
            *) fail "unexpected npm decision $decision" ;;
          esac
          bash scripts/npm-exact-publish.sh verify-published-bounded \
            --tgz "$tgz" --package "$NPM_NAME" --version "$VERSION" \
            --post-action "$action"
          require_release_sha
          publish_tag "$tag"

          if [[ "$PACKAGE" == skills ]]; then
            # SKILLS_RELEASE_BEGIN - the fixture executes this exact block.
            export EXPECTED_ZIPS="aweb-bootstrap.zip aweb-coordination.zip aweb-identity.zip aweb-messaging.zip aweb-team-membership.zip"
            expected="$RUNNER_TEMP/expected-zips"; observed="$RUNNER_TEMP/observed-zips"
            printf '%s\n' $EXPECTED_ZIPS | sort > "$expected"
            release_present=yes
            if ! release_json="$(timeout 30 gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>"$RUNNER_TEMP/release-error")"; then
              if grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then
                release_present=no
              else
                fail "GitHub release observation unavailable; unavailability is never absence"
              fi
            fi
            if [[ "$release_present" == yes ]]; then
              python3 -c 'import json,sys; doc=json.load(sys.stdin); assets=doc.get("assets"); assert isinstance(assets,list); print("\n".join(a["name"] for a in assets))' \
                <<<"$release_json" | sort > "$observed" \
                || fail "GitHub release evidence is malformed"
              extra="$(comm -13 "$expected" "$observed")"
              [[ -z "$extra" ]] || fail "skills release carries extra assets: $extra"
              for name in $EXPECTED_ZIPS; do
                if ! grep -qx "$name" "$observed"; then
                  timeout 30 gh release upload "$tag" "$staging/$name" \
                    || echo "asset upload raced; verifying fresh exact state"
                fi
              done
            else
              timeout 30 gh release create "$tag" --verify-tag --title "$tag" \
                --notes "skills $tag" "$staging"/*.zip \
                || echo "release creation raced; verifying fresh exact state"
            fi

            final_json="$(timeout 30 gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")" \
              || fail "fresh GitHub release read unavailable after create/upload"
            python3 -c 'import json,sys; doc=json.load(sys.stdin); assets=doc.get("assets"); assert isinstance(assets,list); print("\n".join(a["name"] for a in assets))' \
              <<<"$final_json" | sort > "$observed" \
              || fail "fresh GitHub release evidence is malformed"
            diff -u "$expected" "$observed" || fail "skills release asset names differ"
            for name in $EXPECTED_ZIPS; do
              rm -f "$RUNNER_TEMP/$name"
              timeout 30 gh release download "$tag" --pattern "$name" --output "$RUNNER_TEMP/$name" \
                || fail "GitHub release asset $name unavailable"
              bash scripts/npm-exact-publish.sh verify-published \
                --tgz "$staging/$name" --observed "$RUNNER_TEMP/$name"
            done
            # SKILLS_RELEASE_END
          fi
