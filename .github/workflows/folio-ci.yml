name: Folio CI

# Folio's equivalent of library-ci.yml: lint and type-check, unit and contract
# tests, and the real-stack e2e against naapp/folio. Folio's tests fail on any
# warning (pyproject filterwarnings = ["error"]), so a passing run is a clean
# run.
#
# Advisory, like library-ci.yml: aweb main is not protected, so this check
# reports but cannot block a merge. Run it on the exact commit before deploying
# folio.
#
# No path filter, for the reason library-ci.yml gives: a path-filtered gate is
# how naapp coverage went missing before.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Folio lint, test, and real-stack e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout aweb
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: naapp/folio/uv.lock

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go/go.mod
          cache-dependency-path: cli/go/go.sum

      - name: Install locked Folio dependencies
        working-directory: naapp/folio
        run: uv sync --locked

      - name: Build aw from the checkout
        run: |
          make -C cli/go build
          echo "$GITHUB_WORKSPACE/cli/go" >> "$GITHUB_PATH"

      - name: Check the e2e aw build
        run: bash scripts/check-naapp-e2e-aw.sh

      - name: Lint and type-check
        working-directory: naapp/folio
        run: make lint

      - name: Run unit and contract tests
        working-directory: naapp/folio
        run: make test

      # docker-compose.e2e.yml builds the awid service from the repository
      # root, so the e2e exercises the awid of the commit under test.
      - name: Run real-stack e2e
        working-directory: naapp/folio
        run: make e2e
