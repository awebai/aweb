[project]
name = "aweb"
version = "1.27.44rc1"
description = "Agent Web: self-hostable coordination server for AI agents (identity, presence, mail, chat, tasks, locks)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Juan Reyero", email = "juan@juanreyero.com" }
]
requires-python = ">=3.12"
keywords = ["ai", "agents", "coordination", "chat", "mail", "locks", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "awid-service>=0.5.34",
    # Shared origin egress, manifest reader and hooks; no runtime extra.
    "aweb-naapp[egress,hooks]>=0.5.1",
    "base58>=2.1.1",
    "cryptography>=45.0.6",
    "dnspython>=2.8.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "mcp>=1.26.0,<2",
    "pgdbm>=0.5.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "publicsuffix2>=2.20191221",
    "pynacl>=1.6.2",
    "pyyaml>=6.0.2",
    "redis>=6.4.0",
    "typer>=0.16.1",
    "uvicorn[standard]>=0.35.0",
    "prometheus-client>=0.22.1",
]

[tool.uv.sources]
awid-service = { path = "../awid", editable = true }
aweb-naapp = { path = "../naapp-lib", editable = true }
aweb-naapp-testing = { path = "../naapp-lib/testing", editable = true }

[project.urls]
Homepage = "https://github.com/awebai/aweb"
Repository = "https://github.com/awebai/aweb"
Documentation = "https://github.com/awebai/aweb/tree/main/server/docs"
Issues = "https://github.com/awebai/aweb/issues"

[project.scripts]
aweb = "aweb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb"]

# The wheel target above declares what it ships. The sdist declares the same way,
# for the same reason: a denylist ships whatever nobody remembered to name, and an
# untracked file in server/ is exactly what nobody remembers. Anything needed at
# build or install time goes in this list explicitly.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "pyproject.toml",
    "uv.lock",
    "README.md",
]

[dependency-groups]
dev = [
    "aweb-naapp-testing",
    # The naapp clients of this server's app API, driven against its real
    # routes: the app-team-server API's acceptance (design §4, §5). No
    # runtime extra: the modules these tests import need only what the server
    # already depends on, and the extra's webauthn would pull a newer
    # cryptography into the lock the server image installs from.
    "aweb-naapp",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
# NOTE: widening python_files here makes the *.py.recovered probes in tests/
# collectible again. They are preserved evidence, two of them red by design.
# Read tests/RECOVERED-PROBES.md before changing this key.
pythonpath = ["src", "../awid/src"]
