[project]
name = "awid-service"
version = "0.5.41rc1"
description = "awid.ai identity registry service and shared awid primitives package"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Juan Reyero", email = "juan@juanreyero.com" }
]
requires-python = ">=3.12"
dependencies = [
    "base58>=2.1.1",
    "dnspython>=2.8.0",
    "fastapi>=0.116.1",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "pgdbm>=0.5.0",
    # asyncpg 0.31.0 never frees a pooled connection that a protocol abort
    # closed, so closing the pool waits forever; 0.32.0 returns it (aweb-adji).
    "asyncpg>=0.32.0",
    "publicsuffix2>=2.20191221",
    "pynacl>=1.6.2",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "redis>=6.4.0",
    "typer>=0.16.1",
    "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb"
Repository = "https://github.com/awebai/aweb"
Documentation = "https://github.com/awebai/aweb/tree/main/docs"

[project.scripts]
awid = "awid_service.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awid", "src/awid_service"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    "AGENTS.md",
    "CLAUDE.md",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff==0.15.0",
    "trustme>=1.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Imported pytest fixtures are registered by name, then injected by signature.
"tests/**" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
files = ["src/awid", "src/awid_service"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
