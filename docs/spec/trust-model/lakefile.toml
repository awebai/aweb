name = "trustweb"
defaultTargets = ["TrustWeb", "DocCheck"]

[[lean_lib]]
name = "TrustWeb"

[[input_file]]
name = "readme"
path = "README.md"
text = true

[[input_file]]
name = "claims"
path = "CLAIMS.md"
text = true

[[input_file]]
name = "modelCases"
path = "../../../docs/vectors/trust-web-cases-model-v2.json"
text = true

[[lean_lib]]
name = "DocCheck"
roots = ["TrustWeb.DocNames", "TrustWeb.CasesCheck"]
needs = ["readme", "claims", "modelCases"]

[[lean_exe]]
name = "trust-web-cases"
root = "TrustWeb.Emit"
