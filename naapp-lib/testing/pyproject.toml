[project]
name = "aweb-naapp-testing"
version = "0.5.1rc1"
description = "Test support for naapps on aweb-naapp: real AWID routes on PostgreSQL, a team-auth v2 signer, a software WebAuthn authenticator, a team owner-act signer and a real local SMTP server. Dev-only; never a production dependency."
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aiosmtpd>=1.4.6",
  # Released in lockstep with aweb-naapp, from the same tag and at the same version.
  "aweb-naapp[hooks,runtime]==0.5.1rc1",
  # The first AWID release with the shared in-process registry fixtures.
  "awid-service>=0.5.33rc1",
  "cbor2>=5.6.0",
  "cryptography>=46.0.0",
  "dnspython>=2.7.0",
]

[project.optional-dependencies]
# The aweb coordination server in-process (aweb.testing), found through a
# team's AWID record as a naapp finds it. Needs Redis at REDIS_URL.
server = [
  "aweb>=1.27.35rc1",
  "pytest-asyncio>=1.2.0",
  "redis>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_testing"]

[tool.uv.sources]
aweb-naapp = { path = "..", editable = true }
awid-service = { path = "../../awid", editable = true }
aweb = { path = "../../server", editable = true }
