[project]
name = "aweb-naapp-testing"
version = "0.1.0"
description = "Test support for naapps on aweb-naapp: real AWID routes on PostgreSQL, a team-auth v2 signer, a software WebAuthn authenticator and a team owner-act signer. Dev-only; never a production dependency."
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aweb-naapp[hooks,runtime]",
  "awid-service",
  "cbor2>=5.6.0",
  "cryptography>=46.0.0",
  "dnspython>=2.7.0",
]

[project.optional-dependencies]
# The aweb coordination server in-process (aweb.testing), found through a
# team's AWID record as a naapp finds it. Needs Redis at REDIS_URL.
server = [
  "aweb",
  "pytest-asyncio>=1.2.0",
  "redis>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_testing"]

[tool.uv.sources]
aweb-naapp = { path = "..", editable = true }
awid-service = { path = "../../awid", editable = true }
aweb = { path = "../../server", editable = true }
