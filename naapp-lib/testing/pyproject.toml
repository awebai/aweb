[project]
name = "aweb-naapp-testing"
version = "0.2.0"
description = "Test support for naapps on aweb-naapp: real AWID routes on PostgreSQL, a team-auth v2 signer, a software WebAuthn authenticator and a team owner-act signer. Dev-only; never a production dependency."
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  # Released in lockstep with aweb-naapp, from the same tag and at the same version.
  "aweb-naapp[hooks,runtime]==0.2.0",
  # The first awid release with the principal-attestation records the runtime reads.
  "awid-service>=0.5.30",
  "cbor2>=5.6.0",
  "cryptography>=46.0.0",
  "dnspython>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_testing"]

[tool.uv.sources]
aweb-naapp = { path = "..", editable = true }
awid-service = { path = "../../awid", editable = true }
