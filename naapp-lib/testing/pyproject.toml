[project]
name = "aweb-naapp-testing"
version = "0.1.0"
description = "Test support for naapps on aweb-naapp: real AWID routes on PostgreSQL and a team-auth v2 signer. Dev-only; never a production dependency."
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aweb-naapp[runtime]",
  "awid-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_testing"]

[tool.uv.sources]
aweb-naapp = { path = "..", editable = true }
awid-service = { path = "../../awid", editable = true }
