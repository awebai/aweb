[project]
name = "aweb-naapp"
version = "0.1.0"
description = "Reusable Native Agentic App (naapp) docs surface: shared chrome, the aweb design system, and manifest-driven llms.txt and reference generators."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "awid", "aweb", "naapp", "manifest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
# Request-time runtime code under aweb_naapp.runtime. The docs
# surface (`import aweb_naapp`) never imports these.
runtime = [
  "awid-service",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "pgdbm>=0.5.0",
  "pydantic-settings>=2.10.1",
  "pynacl>=1.6.2",
  "webauthn>=3.0.1",
]
# The shared durable outbox, aweb_naapp.outbox: pgdbm only, so the core server
# can use it without the naapp runtime.
outbox = [
  "pgdbm>=0.5.0",
]
# The shared egress guard, aweb_naapp.egress: URL canonicalization, its own
# resolver and a pinned verified connection, without the naapp runtime.
# publicsuffixlist is pinned exactly on purpose: the list decides which
# wildcard destinations are refused, so it changes only by a reviewed bump of
# this pin together with docs/vectors/egress-url-v1.json. Do not loosen it.
egress = [
  "dnspython>=2.7.0",
  "httpcore[asyncio]>=1.0.9",
  "idna>=3.10",
  "publicsuffixlist==1.1.0.20261018",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb-naapp"
Repository = "https://github.com/awebai/aweb-naapp"
Issues = "https://github.com/awebai/aweb-naapp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp"]

[tool.uv.sources]
awid-service = { path = "../awid" }

[dependency-groups]
dev = [
  "aweb-naapp[runtime]",
  "aweb-naapp[egress]",
  "cryptography>=44.0.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "httpx2>=2.9.1",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
