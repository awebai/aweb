[project]
name = "aweb-naapp"
version = "0.5.1rc1"
description = "Reusable Native Agentic App (naapp) docs surface: shared chrome, the aweb design system, and manifest-driven llms.txt and reference generators."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "awid", "aweb", "naapp", "manifest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
# Independent HPKE helper; never pulled in by hooks or runtime.
crypto = ["cryptography>=50.0.0"]
# Replay store usable without HTTP or identity dependencies.
nonces = ["pgdbm>=0.5.0"]
# Request-time runtime code under aweb_naapp.runtime. The docs
# surface (`import aweb_naapp`) never imports these.
runtime = [
  # The first awid release with the principal-attestation records the runtime reads.
  "awid-service>=0.5.30",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "jsonschema>=4.23.0",
  "pgdbm>=0.5.0",
  "pydantic-settings>=2.10.1",
  "pynacl>=1.6.2",
  "webauthn>=3.0.1",
  "cbor2>=6.1.2",
]
# The shared durable outbox, aweb_naapp.outbox: pgdbm only, so the core server
# can use it without the naapp runtime.
outbox = [
  "pgdbm>=0.5.0",
]
# The signing-key reader, aweb_naapp.signing_key: pynacl only, so the core
# server can read its keys the same way without the naapp runtime.
signing-key = [
  "pynacl>=1.6.2",
]
# The shared dispatch state machine, aweb_naapp.dispatch: pgdbm only.
dispatch = [
  "pgdbm>=0.5.0",
]
# The shared idempotency store, aweb_naapp.idempotency: pgdbm only.
idempotency = [
  "pgdbm>=0.5.0",
]
# Shared role assignments, aweb_naapp.roles: pgdbm only.
roles = [
  "pgdbm>=0.5.0",
]
# The shared token-bucket rate limits, aweb_naapp.ratelimit: pgdbm only.
ratelimit = [
  "pgdbm>=0.5.0",
]
# The shared page-format validator, aweb_naapp.pages: JSON Schema only, no I/O.
pages = [
  "jsonschema>=4.23",
]
# The shared egress guard, aweb_naapp.egress: URL canonicalization, its own
# resolver and a pinned verified connection, without the naapp runtime.
# publicsuffixlist is pinned exactly on purpose: the list decides which
# wildcard destinations are refused, so it changes only by a reviewed bump of
# this pin together with docs/vectors/egress-url-v2.json. Do not loosen it.
egress = [
  "dnspython>=2.7.0",
  "httpcore[asyncio]>=1.0.9",
  "idna>=3.10",
  "publicsuffixlist==1.1.0.20261018",
]
# aw-hooks, aweb_naapp.hooks: the catalog reader (stdlib), the event envelope,
# the delivery credential and the owner-act verifier with its nonce table.
# It shares awid's did:key and canonical-JSON primitives and pgdbm, never the
# naapp runtime: importing it loads no web framework, settings or HTTP client
# (a subprocess test pins that). Installing awid-service brings that package's
# own dependencies, which the core server and every naapp already carry.
hooks = [
  "awid-service>=0.5.30",
  "pgdbm>=0.5.0",
  "pynacl>=1.6.2",
]

# Persistent pages need PostgreSQL and the frozen validator, not HTTP/auth deps.
page-store = [
  "pgdbm>=0.5.0",
  "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb/tree/main/naapp-lib"
Repository = "https://github.com/awebai/aweb"
Issues = "https://github.com/awebai/aweb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp"]

[tool.uv.sources]
awid-service = { path = "../awid", editable = true }
aweb-naapp-testing = { path = "testing", editable = true }
aweb = { path = "../server", editable = true }

[dependency-groups]
dev = [
  "aweb-naapp[runtime,pages]",
  "aweb-naapp[egress]",
  "cryptography>=44.0.0",
  "aweb-naapp-testing[server]",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "httpx2>=2.9.1",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
  "hatchling>=1.32.4",
  # Exact: the candidate gate's test image installs the Chromium this version
  # drives, through this lock, so the two cannot drift.
  "playwright==1.63.0",
  "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
