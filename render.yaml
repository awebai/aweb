services:
  - type: web
    name: folio-api
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FOLIO_DATABASE_URL
        sync: false
      - key: FOLIO_AWID_REGISTRY_URL
        value: https://api.awid.ai
      - key: FOLIO_PUBLIC_ORIGIN
        sync: false
      - key: FOLIO_DB_POOL_MIN_CONNECTIONS
        value: "1"
      - key: FOLIO_DB_POOL_MAX_CONNECTIONS
        value: "5"
      - key: FOLIO_DB_STATEMENT_CACHE_SIZE
        value: "0"
