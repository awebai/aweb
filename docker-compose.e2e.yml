# Combined local end-to-end stack: awid + aweb + Library on one network.
#
# Brings up, from source, the services the profile/team/Library flow exercises:
#   postgres (tmpfs, ephemeral) + redis + awid + aweb + library
#
# awid, aweb and library build from this repo (context `.`); library depends on
# the in-repo awid and naapp-lib. Its committed aweb.team fixture is selected by
# the e2e stack script and stays overridable via LIBRARY_E2E_BLUEPRINT_SRC.
#
# Rate limiting is disabled and DNS verification skipped (like folio's
# docker-compose.e2e.yml) so a freshly created test team works offline.
# Postgres data lives on tmpfs, so `down -v` leaves no state behind.
#
# Nothing is published to the host. Journeys run inside this network
# (scripts/e2e-library-stack.sh journey): the server fetches an app manifest
# only over pinned HTTPS, so Library serves TLS at an in-network name with a
# stack CA, and every team installs Library before it calls a member route.
# The LIBRARY_E2E_*_HOST names are the scoped aliases the stack script sets.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aweb
      POSTGRES_PASSWORD: aweb
      POSTGRES_DB: aweb
    # Create the separate `library` database alongside `aweb` on first init.
    # With tmpfs every `up` is a fresh init, so this always runs.
    volumes:
      - ./scripts/e2e/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aweb -d aweb"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    build:
      context: .
      dockerfile: awid/Dockerfile
    environment:
      AWID_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_DB_SCHEMA: awid
      AWID_LOG_JSON: "false"
      AWID_RATE_LIMIT_BACKEND: redis
      AWID_RATE_LIMIT_DISABLED: "true"
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_SKIP_DNS_VERIFY: "1"
      AWID_PUBLIC_ORIGINS: http://awid:8010,http://${LIBRARY_E2E_AWID_HOST:-awid}:8010
    networks:
      default:
        aliases: ["${LIBRARY_E2E_AWID_HOST:-awid}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/ready"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  aweb:
    build:
      context: .
      dockerfile: server/Dockerfile
    # The real HTTPS manifest fetcher, pinned to this stack's Library origin.
    # The server serves HTTPS itself: teams publish it as their team server.
    command: ["/app/.venv/bin/python", "/fixture/e2e/stack_server.py", "--app-origin", "https://${LIBRARY_E2E_LIBRARY_HOST:-library-stack.test}:8765", "--ca-file", "/fixture/tls/ca.pem", "--user-agent", "library-stack-test/1", "--port", "8000", "--tls-certfile", "/fixture/tls/server.pem", "--tls-keyfile", "/fixture/tls/server.key"]
    volumes:
      - fixture:/fixture:ro
    networks:
      default:
        aliases: ["${LIBRARY_E2E_AWEB_HOST:-aweb}"]
    environment:
      AWEB_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWEB_REDIS_URL: redis://redis:6379/0
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 8000
      AWEB_PUBLIC_ORIGIN: https://${LIBRARY_E2E_AWEB_HOST:-aweb}:8000
      APP_ENV: development
      AWEB_LOG_JSON: "false"
      AWID_REGISTRY_URL: http://awid:8010
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_PUBLIC_REGISTRY_URL: http://${LIBRARY_E2E_AWID_HOST:-awid}:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awid:
        condition: service_healthy
    healthcheck:
      # The stack's certificate names localhost for this probe.
      test: ["CMD", "curl", "-fsS", "--cacert", "/fixture/tls/ca.pem", "https://localhost:8000/ready"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  library:
    build:
      context: .
      dockerfile: naapp/library/Dockerfile
    environment:
      LIBRARY_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/library
      LIBRARY_AWID_REGISTRY_URL: http://awid:8010
      LIBRARY_AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      # Clients sign the team-auth audience (aud) as the origin they call, so
      # this is the in-network TLS origin every journey uses.
      LIBRARY_PUBLIC_ORIGIN: https://${LIBRARY_E2E_LIBRARY_HOST:-library-stack.test}:8765
      LIBRARY_AUTH_CACHE_TTL_SECONDS: "2"
      LIBRARY_APP_KEY_FILES: '{"library:grant-read-1": "/fixture/library/grant-read.hex"}'
      # The stack's own coordination server, the one team server Library reads
      # grants from: its operator's own, on the stack's network, reached
      # through Library's egress guard and trusted through the stack CA. The
      # network itself comes from scripts/e2e/stack-subnet.compose.yml.
      LIBRARY_TEAM_SERVER_INTERNAL_ORIGINS: '["https://${LIBRARY_E2E_AWEB_HOST:-aweb}:8000"]'
      LIBRARY_HOOK_CA_FILE: /fixture/tls/ca.pem
      # The stack CA signs the team server Library reads grants from.
      SSL_CERT_FILE: /fixture/tls/ca.pem
      PORT: "8765"
    command: ["/app/.venv/bin/uvicorn", "library.api:app", "--host", "0.0.0.0", "--port", "8765", "--ssl-keyfile", "/fixture/tls/server.key", "--ssl-certfile", "/fixture/tls/server.pem"]
    volumes:
      - fixture:/fixture:ro
      # Library's template published from this stack's origin, so it runs as
      # app id "library" here (scripts/e2e/library_stack_prepare.py).
      - library-source:/app/naapp/library/src/library
    networks:
      default:
        aliases: ["${LIBRARY_E2E_LIBRARY_HOST:-library-stack.test}"]
    depends_on:
      postgres:
        condition: service_healthy
      awid:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import os,ssl,sys,urllib.request; origin=os.environ['LIBRARY_PUBLIC_ORIGIN']; sys.exit(0 if urllib.request.urlopen(origin + '/ready', context=ssl.create_default_context(cafile='/fixture/tls/ca.pem')).status==200 else 1)"
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

volumes:
  fixture:
    name: ${LIBRARY_E2E_PROJECT:-aweb-e2e-stack}-fixture
  library-source:
    name: ${LIBRARY_E2E_PROJECT:-aweb-e2e-stack}-library-source
