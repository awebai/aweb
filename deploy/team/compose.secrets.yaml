# The Secrets app of one team's deployment, in the model only when
# deployment.yaml has a secrets section: the rendered COMPOSE_FILE names it.
services:
  secrets:
    extends:
      file: ../../naapp/secrets/compose.secrets.yaml
      service: secrets
    image: ${SECRETS_IMAGE:?SECRETS_IMAGE is required, secrets.image}
    networks: [services]
    ports:
      - "${SECRETS_BIND_ADDRESS:-127.0.0.1}:${SECRETS_PORT:-8770}:8770"
    volumes:
      - "${SECRETS_DIR:?SECRETS_DIR is required, compose.secretsDir}/${SECRETS_SECRETS:-secrets}:/run/secrets/secrets:ro"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
