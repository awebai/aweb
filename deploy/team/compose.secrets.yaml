# The Secrets app of one team's deployment, in the model only when
# deployment.yaml has a secrets section: the rendered COMPOSE_FILE names it.
services:
  # Explicit one-shot operator job. The runtime service below never mounts
  # the database administrator's password. Disabled during ordinary up.
  secrets-erasure-init:
    profiles: [erasure-init]
    image: ${SECRETS_IMAGE:?SECRETS_IMAGE is required, secrets.image}
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    networks: [services]
    volumes:
      - "${SECRETS_DIR:?SECRETS_DIR is required, compose.secretsDir}/${POSTGRES_SECRETS:-postgres}/password:/run/operator/password:ro"
    entrypoint: [python, -m, aweb_secrets.erasure]
    command:
      - init-erasure
      - --bundled-password-file
      - /run/operator/password
      - --content-schema
      - ${SECRETS_DB_SCHEMA:-public}
      - --application-role
      - secrets
      - --max-backup-age-seconds
      - "${SECRETS_BACKUP_MAX_AGE_SECONDS:-0}"

  secrets:
    extends:
      file: ../../naapp/secrets/compose.secrets.yaml
      service: secrets
    image: ${SECRETS_IMAGE:?SECRETS_IMAGE is required, secrets.image}
    networks: [services]
    ports:
      - "${SECRETS_BIND_ADDRESS:-127.0.0.1}:${SECRETS_PORT:-8770}:8770"
    volumes:
      - "${SECRETS_DIR:?SECRETS_DIR is required, compose.secretsDir}/${SECRETS_SECRETS:-secrets}:/run/secrets/secrets:ro"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
