[project]
name = "aweb-key-holder"
version = "0.0.0"
description = "Self-hosted organisation keys and typed controller operations"
requires-python = ">=3.12"
dependencies = ["awid-service>=0.5.40rc2", "pynacl>=1.6.2", "aweb-approval-service"]

[project.scripts]
aweb-key-holder = "aweb_key_holder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_key_holder"]

[tool.uv.sources]
awid-service = { path = "../awid", editable = true }
aweb-approval-service = { git = "https://github.com/awebai/approval-service.git", rev = "a7fe24d273e60cc28fa2673b0762d95013f3b759" }

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
