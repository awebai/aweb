[project]
name = "aweb-key-holder"
version = "0.0.0"
description = "Self-hosted organisation keys and typed controller operations"
requires-python = ">=3.12"
dependencies = ["awid-service>=0.5.40rc2", "pynacl>=1.6.2", "aweb-approval-service", "aweb-naapp[webauthn]"]

[project.scripts]
aweb-key-holder = "aweb_key_holder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_key_holder"]

[tool.uv.sources]
awid-service = { path = "../awid", editable = true }
aweb-naapp = { path = "../naapp-lib", editable = true }
aweb-approval-service = { git = "https://github.com/awebai/approval-service.git", rev = "2aa792fd635ca682281e71ba8dcd94cc40d4ac26" }

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.2.0", "ruff==0.15.0", "mypy==1.19.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/aweb_key_holder"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
