# The release component graph: every shippable artifact this repository
# produces or forces, every typed dependency between them, and every declared
# input a release needs before it starts. scripts/release_driver.py computes
# the moving set and publication order from this file.
#
# Edge types: bundled-build-input (a change to the input moves every consumer
# that embeds it, measured against each consumer's last published baseline),
# publication-prerequisite (orders the dependent after the prerequisite when
# both move), pointer (the target is FORCED to move whenever a source moves -
# its state is definitionally stale), runtime-contract (a version-skew edge
# for the G5 matrix runner; support declarations must name a fleet
# measurement or an approved deprecation, and anything else is
# declared-incomplete, which blocks release execution until aweb-abbe.7
# measures - floors are never invented here).
#
# aweb-cloud's lock/pin state (ac-pin) is a forced pointer consumer of server
# and awid: publishing either makes the pin stale by definition, and updating it
# is an effect this release performs.
#
# AC's production deploy is NOT in this graph. It is cut from AC's own
# repository, behind AC's credentials and AC's approval, and an aweb release has
# no business demanding it: publishing a server makes AC's pin stale and says
# so, and when AC deploys is AC's decision. Modelling that deploy here forced
# every server and awid release to drag in a node this repository cannot
# perform, which blocked both of them entirely.

[component.server]
source_paths = ["server/"]
version_source = { type = "pyproject", path = "server/pyproject.toml" }
tag_format = "server-v{version}"
publish_lane = { workflow = ".github/workflows/pypi-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "pypi", package = "aweb" } }
verify = { command = "curl -fsS https://pypi.org/pypi/aweb/{version}/json" }

[component.awid-pypi]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-service-v{version}"
publish_lane = { workflow = ".github/workflows/pypi-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "pypi", package = "awid-service" } }
verify = { command = "curl -fsS https://pypi.org/pypi/awid-service/{version}/json" }

[component.awid-image]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-v{version}"
publish_lane = { workflow = ".github/workflows/awid-image-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "ghcr", package = "awebai/awid" } }
verify = { command = "docker manifest inspect ghcr.io/awebai/awid:{version}" }

[component.aw]
source_paths = ["cli/go/"]
version_source = { type = "tag-history", script = "scripts/cli-release-version.sh" }
tag_format = "aw-v{version}"
publish_lane = { workflow = ".github/workflows/aw-release.yml", repository = "awebai/aw", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "github-release", repo = "awebai/aw" } }
verify = { command = "scripts/check-cli-release-vcs-stamps.sh" }

[component.channel-core]
source_paths = ["channel-core/"]
publishable = false

[component.channel]
source_paths = ["channel/"]
version_source = { type = "package-json", path = "channel/package.json" }
tag_format = "channel-v{version}"
publish_lane = { workflow = ".github/workflows/npm-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "npm", package = "@awebai/claude-channel" } }
verify = { command = "npm view @awebai/claude-channel@{version} version" }
delivery_restart = { proof = "plugin update + Claude Code session restart per installed host", note = "an installed plugin keeps loaded code until restart" }

[component.pi]
source_paths = ["pi-extension/"]
version_source = { type = "package-json", path = "pi-extension/package.json" }
tag_format = "pi-v{version}"
publish_lane = { workflow = ".github/workflows/npm-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "npm", package = "@awebai/pi" } }
verify = { command = "npm view @awebai/pi@{version} version" }
delivery_restart = { inventory = "pgrep -x pi", update = "pi update npm:@awebai/pi", proof = "resolved cache package.json version + fresh process per host" }

[component.skills]
source_paths = ["packages/claude-skills/"]
version_source = { type = "package-json", path = "packages/claude-skills/package.json" }
tag_format = "skills-v{version}"
publish_lane = { workflow = ".github/workflows/npm-release.yml", repository = "awebai/aweb", provider = "github-workflow-artifacts", modes = ["stage-only", "publish-continuation", "verify-only"], registry = { type = "npm", package = "@awebai/claude-skills" } }
verify = { command = "npm view @awebai/claude-skills@{version} version" }

[component.server-image-payload]
source_paths = [
    "server/pyproject.toml",
    "server/README.md",
    "server/src",
]
publishable = false
# Exactly what awid/Dockerfile.release copies into the published image
# (lines 15 and 20), and nothing else. The image bytes depend on these three
# paths even though awid-image's own source path is awid/.
#
# Naming the three rather than the whole server component is the difference
# between a truthful declaration and a costly one: a change confined to
# server/tests/ or to unrelated server docs would otherwise force an immutable
# production image release, and publication cannot be undone. The image lane is
# the only consumer - server's own PyPI release continues to move on any change
# under server/, through the server component.

[component.agent-skills]
source_paths = [
    "skills/aweb-bootstrap",
    "skills/aweb-coordination",
    "skills/aweb-identity",
    "skills/aweb-messaging",
    "skills/aweb-team-membership",
]
publishable = false
# The shared skill sources. Neither pi-extension/ nor packages/claude-skills/
# commits a skills directory: each one's build copies these five in, and ships
# them in its tarball. So a change here changes published bytes for both, and
# the graph would otherwise compute that nothing moved. Only the bundled five
# are listed - skills/aweb-agent-instantiation and skills/DECISIONS.md reach no
# artifact. test_bundled_skill_sources_match_what_the_packages_copy compares
# this list against the copy commands so the two cannot drift apart.

[component.marketplace-pointer]
publishable = false
repository = "github.com/awebai/claude-plugins"
# Explicit bump of awebai/claude-plugins marketplace.json; the caret-range
# experiment is deferred task aweb-abbf.
#
# This is a delivery effect, not a follow-up: Claude Code re-resolves an npm
# source only when the marketplace entry advertises a version, so publishing
# channel or skills without moving this pointer reaches nobody. It is served by
# a PointerLane through --pointer-adapter; the adapter knows its own repository.
#
# Deliberately NO `lane` key. A lane here made this a delivery node carrying a
# delivery-lane-proof obligation that no code can produce and that
# --delivery-proof refuses to accept for it, so the node could never publish.

[component.ac-pin]
publishable = false
sibling_pins = [
    { pin_file = "release-pin.toml", section = "aweb", field = "git_sha", identity_fields = ["version", "git_ref", "git_sha"], component = "server", checkout = "../aweb", repository = "github.com/awebai/aweb", pin_repository = "github.com/awebai/ac" },
    { pin_file = "backend/uv.lock", kind = "lock-version", package = "awid-service", component = "awid-pypi", pin_repository = "github.com/awebai/ac" },
]
# ac's source pointer state: backend/uv.lock and release-pin.toml,
# both living in the AC repository (pin_repository) and resolved only from a
# declared external context - never relative to this repository. The server pin
# advertises its complete version/ref/SHA identity; dependency changes regenerate
# AC's exact uv lock rather than rewriting package entries. Updating these
# source pointers needs no production credentials and never deploys AC.

[component.sites]
source_paths = ["docs/identity-guide.md", "docs/trust-model.md", "awid/site/"]
lane = { command = "make release-awid-site" }
publishable = false
approval_required = true
# The awid landing site: a delivery node with a real lane. No delivered
# baseline is observable from this repository's origin (the deploy branch the
# lane pushes is absent there), so sites plans conservatively on every run
# until the site lane establishes an observable baseline_ref.

[[edge]]
type = "bundled-build-input"
from = "channel-core"
to = ["channel", "pi"]

[[edge]]
type = "bundled-build-input"
from = "agent-skills"
to = ["pi", "skills"]

[[edge]]
type = "bundled-build-input"
from = "server-image-payload"
to = ["awid-image"]

[[edge]]
type = "publication-prerequisite"
from = "awid-pypi"
to = ["server"]

[[edge]]
type = "publication-prerequisite"
from = "aw"
to = ["pi"]

[[edge]]
type = "pointer"
from = "channel"
to = ["marketplace-pointer"]

[[edge]]
type = "pointer"
from = "skills"
to = ["marketplace-pointer"]

[[edge]]
type = "pointer"
from = "server"
to = ["ac-pin"]

[[edge]]
type = "pointer"
from = "awid-pypi"
to = ["ac-pin"]

# The .7.1 child emits this edge's measured support document through
# `make measure-release-skew-cli-server`. Keep the declaration incomplete until
# those exact candidate/published cell bytes are externally anchored; then add
# measured:<id> plus its structured workflow-artifact record in the reviewed
# anchoring round. Server 1.26.31 is the negative-only distinct-ID/lock
# control; 1.26.35 is the first published fix. aw 1.34.2 is installed-fleet
# compatibility only and remains rejected dirty provenance, never a candidate.
[[edge]]
type = "runtime-contract"
a = "aw"
b = "server"
journey = "make cli-e2e"
artifacts = { a = "github-release:awebai/aw", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "channel"
b = "server"
journey = "channel integration journey (aweb-abbe.7.2)"
artifacts = { a = "npm:@awebai/claude-channel", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "pi"
b = "server"
journey = "pi integration journey (aweb-abbe.7.2)"
artifacts = { a = "npm:@awebai/pi", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "server"
b = "server"
journey = "make test-federation-e2e (both request directions)"
artifacts = { a = "pypi:aweb", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only", set = "measured:93675cc26aa05661daa86bcc7f9c80503b8421f6290edd25cd0237105c060f5e", record = { authority = "repository", artifact_id = "support:server-federation:1.26.35", path = "release/measurements/server-federation-1.26.35.json", digest = "6e65e483e83552f4524758437bcec72cb9c2931b6cda2b1a4b2e0f4c59944825" } }

[[edge]]
type = "runtime-contract"
a = "server"
b = "server"
journey = "persisted-state fixture (aweb-abbe.7.4): migrate a database created by the published release; published server against upgraded schema where rollout is non-atomic"
artifacts = { a = "pypi:aweb", b = "pypi:aweb" }
direction = "persisted-state-both"
supported = { policy = "additive-only" }
