# The release component graph: every shippable artifact this repository
# produces or forces, every typed dependency between them, and every declared
# input a release needs before it starts. scripts/release_driver.py computes
# the moving set and publication order from this file.
#
# Edge types: bundled-build-input (a change to the input moves every consumer
# that embeds it, measured against each consumer's last published baseline),
# publication-prerequisite (orders the dependent after the prerequisite when
# both move), pointer (the target is FORCED to move whenever a source moves -
# its state is definitionally stale), runtime-contract (a version-skew edge
# for the G5 matrix runner; support declarations must name a fleet
# measurement or an approved deprecation, and anything else is
# declared-incomplete, which blocks release execution until aweb-abbe.7
# measures - floors are never invented here).
#
# aweb-cloud's lock/pin state (ac-pin) is a forced pointer consumer of server
# and awid: publishing either makes the pin stale by definition. Its declared
# inputs are the exact external source pins alone; the production credential
# and human approval live on the separate downstream ac-gate boundary. The AC
# release itself is cut from its own repository.

[component.server]
source_paths = ["server/"]
version_source = { type = "pyproject", path = "server/pyproject.toml" }
tag_format = "server-v{version}"
publish_lane = { workflow = ".github/workflows/server-release.yml", registry = { type = "pypi", package = "aweb" } }
verify = { command = "curl -fsS https://pypi.org/pypi/aweb/{version}/json" }

[component.awid-pypi]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-service-v{version}"
publish_lane = { workflow = ".github/workflows/awid-pypi-release.yml", registry = { type = "pypi", package = "awid-service" } }
verify = { command = "curl -fsS https://pypi.org/pypi/awid-service/{version}/json" }

[component.awid-image]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-v{version}"
publish_lane = { workflow = ".github/workflows/awid-release.yml", registry = { type = "ghcr", package = "awebai/awid" } }
verify = { command = "docker manifest inspect ghcr.io/awebai/awid:{version}" }

[component.aw]
source_paths = ["cli/go/"]
version_source = { type = "tag-history", script = "scripts/cli-release-version.sh" }
tag_format = "aw-v{version}"
publish_lane = { workflow = ".github/workflows/aw-release.yml", registry = { type = "github-release", repo = "awebai/aw" } }
verify = { command = "scripts/check-cli-release-vcs-stamps.sh" }

[component.channel-core]
source_paths = ["channel-core/"]
publishable = false

[component.channel]
source_paths = ["channel/"]
version_source = { type = "package-json", path = "channel/package.json" }
tag_format = "channel-v{version}"
publish_lane = { workflow = ".github/workflows/channel-release.yml", registry = { type = "npm", package = "@awebai/claude-channel" } }
verify = { command = "npm view @awebai/claude-channel@{version} version" }
delivery_restart = { proof = "plugin update + Claude Code session restart per installed host", note = "an installed plugin keeps loaded code until restart" }

[component.pi]
source_paths = ["pi-extension/"]
version_source = { type = "package-json", path = "pi-extension/package.json" }
tag_format = "pi-v{version}"
publish_lane = { workflow = ".github/workflows/pi-release.yml", registry = { type = "npm", package = "@awebai/pi" } }
verify = { command = "npm view @awebai/pi@{version} version" }
delivery_restart = { inventory = "pgrep -x pi", update = "pi update npm:@awebai/pi", proof = "resolved cache package.json version + fresh process per host" }

[component.skills]
source_paths = ["packages/claude-skills/"]
version_source = { type = "package-json", path = "packages/claude-skills/package.json" }
tag_format = "skills-v{version}"
publish_lane = { workflow = ".github/workflows/skills-release.yml", registry = { type = "npm", package = "@awebai/claude-skills" } }
verify = { command = "npm view @awebai/claude-skills@{version} version" }

[component.marketplace-pointer]
publishable = false
# Explicit bump of awebai/claude-plugins marketplace.json; the caret-range
# experiment is deferred task aweb-abbf.

[component.ac-pin]
publishable = false
sibling_pins = [
    { pin_file = "release-pin.toml", section = "aweb", field = "git_sha", component = "server", checkout = "../aweb", repository = "github.com/awebai/aweb", pin_repository = "github.com/awebai/ac" },
    { pin_file = "backend/uv.lock", section = "package", field = "awid-service", kind = "lock-version", component = "awid-pypi", checkout = "../aweb", repository = "github.com/awebai/aweb", pin_repository = "github.com/awebai/ac" },
]
# aweb-cloud's source pointer state: backend/uv.lock and release-pin.toml,
# both living in the AC repository (pin_repository) and resolved only from a
# declared external context - never relative to this repository. Updating
# them needs no production credentials; that boundary belongs to ac-gate.

[component.ac-gate]
publishable = false
approval_required = true
credential_paths = [
    { env = "MIGRATION_GATE_ENV_FILE", purpose = "non-bypass production migration immutability" },
]
# The downstream AC gate/deploy boundary: canonical make release-ready with
# the non-bypass production migration-immutability credential path, behind an
# explicit structured human approval. Kept separate from ac-pin so a source
# pointer update cannot demand production credentials.

[component.sites]
source_paths = ["docs/identity-guide.md", "docs/trust-model.md", "awid/site/"]
lane = { command = "make release-awid-site" }
publishable = false
approval_required = true
# The awid landing site: a delivery node with a real lane. No delivered
# baseline is observable from this repository's origin (the deploy branch the
# lane pushes is absent there), so sites plans conservatively on every run
# until the site lane establishes an observable baseline_ref.

[[edge]]
type = "bundled-build-input"
from = "channel-core"
to = ["channel", "pi"]

[[edge]]
type = "publication-prerequisite"
from = "awid-pypi"
to = ["server"]

[[edge]]
type = "publication-prerequisite"
from = "aw"
to = ["pi"]

[[edge]]
type = "pointer"
from = "channel"
to = ["marketplace-pointer"]

[[edge]]
type = "pointer"
from = "skills"
to = ["marketplace-pointer"]

[[edge]]
type = "pointer"
from = "server"
to = ["ac-pin"]

[[edge]]
type = "pointer"
from = "awid-pypi"
to = ["ac-pin"]

[[edge]]
type = "pointer"
from = "ac-pin"
to = ["ac-gate"]

[[edge]]
type = "runtime-contract"
a = "aw"
b = "server"
journey = "make cli-e2e"
artifacts = { a = "github-release:awebai/aw", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "channel"
b = "server"
journey = "channel integration journey (aweb-abbe.7.2)"
artifacts = { a = "npm:@awebai/claude-channel", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "pi"
b = "server"
journey = "pi integration journey (aweb-abbe.7.2)"
artifacts = { a = "npm:@awebai/pi", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "server"
b = "server"
journey = "make test-federation-e2e (both request directions)"
artifacts = { a = "pypi:aweb", b = "pypi:aweb" }
direction = "both"
supported = { policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "server"
b = "server"
journey = "persisted-state fixture (aweb-abbe.7.4): migrate a database created by the published release; published server against upgraded schema where rollout is non-atomic"
artifacts = { a = "pypi:aweb", b = "pypi:aweb" }
direction = "persisted-state-both"
supported = { policy = "additive-only" }
