# The release component graph: every shippable artifact this repository
# produces, every typed dependency between them, and every declared input a
# release needs before it starts. scripts/release_driver.py computes the
# moving set and publication order from this file; nothing about release
# composition is recalled per-release.
#
# Edge types: bundled-build-input (a change to the input moves every consumer
# that embeds it), publication-prerequisite (the dependent publishes only
# after the prerequisite is published), runtime-contract (a version-skew edge
# the G5 matrix runner executes for touched components), pointer (declared as
# pointer_for on the pointing component), sibling-pin and delivery-restart
# (declared as component fields).
#
# aweb-cloud is released from its own repository; it appears here because the
# graph must order it after its published dependencies and name its declared
# inputs (production credential path, sibling source pins). Its change
# detection lives with its own repository, not here.

[component.server]
source_paths = ["server/"]
version_source = { type = "pyproject", path = "server/pyproject.toml" }
tag_format = "server-v{version}"

[component.awid-pypi]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-service-v{version}"

[component.awid-image]
source_paths = ["awid/"]
version_source = { type = "pyproject", path = "awid/pyproject.toml" }
tag_format = "awid-v{version}"

[component.aw]
source_paths = ["cli/go/"]
version_source = { type = "tag-history", script = "scripts/cli-release-version.sh" }
tag_format = "aw-v{version}"

[component.channel-core]
source_paths = ["channel-core/"]
publishable = false

[component.channel]
source_paths = ["channel/"]
version_source = { type = "package-json", path = "channel/package.json" }
tag_format = "channel-v{version}"

[component.pi]
source_paths = ["pi-extension/"]
version_source = { type = "package-json", path = "pi-extension/package.json" }
tag_format = "pi-v{version}"
delivery_restart = { inventory = "pgrep -x pi", update = "pi update npm:@awebai/pi", proof = "resolved cache package.json version + fresh process" }

[component.skills]
source_paths = ["packages/claude-skills/"]
version_source = { type = "package-json", path = "packages/claude-skills/package.json" }
tag_format = "skills-v{version}"

[component.marketplace-pointer]
publishable = false
pointer_for = ["channel", "skills"]
# Explicit bump of awebai/claude-plugins marketplace.json remains the standing
# behavior; the caret-range experiment is deferred task aweb-abbf.

[component.ac]
publishable = false
approval_required = true
credential_paths = [
    { env = "MIGRATION_GATE_ENV_FILE", purpose = "non-bypass production migration immutability" },
]
sibling_pins = [
    { pin_file = "release-pin.toml", component = "server", checkout = "../aweb" },
]

[[edge]]
type = "bundled-build-input"
from = "channel-core"
to = ["channel", "pi"]

[[edge]]
type = "publication-prerequisite"
from = "awid-pypi"
to = ["server"]
# server/pyproject.toml requires awid-service at a floor; a server release
# cannot resolve until the awid package is published.

[[edge]]
type = "publication-prerequisite"
from = "aw"
to = ["pi"]
# pi-extension depends on @awebai/aw on npm.

[[edge]]
type = "publication-prerequisite"
from = "server"
to = ["ac"]

[[edge]]
type = "publication-prerequisite"
from = "awid-pypi"
to = ["ac"]

[[edge]]
type = "runtime-contract"
a = "aw"
b = "server"
journey = "make cli-e2e"
supported = { floor = "1.34.3", policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "channel"
b = "server"
journey = "channel integration journey (aweb-abbe.7.2)"
supported = { floor = "1.7.1", policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "pi"
b = "server"
journey = "pi integration journey (aweb-abbe.7.2)"
supported = { floor = "0.3.1", policy = "additive-only" }

[[edge]]
type = "runtime-contract"
a = "server"
b = "server"
journey = "make test-federation-e2e (both request directions)"
supported = { floor = "1.26.35", policy = "additive-only" }
