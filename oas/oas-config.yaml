# OAS deployment for the aweb monorepo.
#
# Scope: the oas/ component root. Instances spawned here attach to a durable
# aweb principal rather than minting a disposable identity — see
# docs/oas-aweb-seam.md for the Principal / Instance / Session model.
name: aweb-oas

# The deployment boundary. Instances coordinate on this aweb team.
team:
  name: aweb-oas
  id: aweb-oas:aweb.ai

agent-types:
  coordinators:
    description: Durable coordinators that attach an existing principal and are never cleanup-owned by an instance

capabilities:
  layers:
    # Our own capability, deliberately NOT upstream's oas.aweb: that one mints
    # an identity at spawn and calls `aw workspace delete` at retire, which
    # would destroy a durable principal. Selection is explicit so a resolution
    # order can never silently substitute one for the other.
    messaging:
      capability: aweb.identity-attach
      from: owned
    # No tasks layer yet — aaaa.10 binds `aw task`/`aw work`. Until then this
    # deployment coordinates through mail and the board directly.
    tasks: none
    knowledge: none
