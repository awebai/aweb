[project]
name = "aweb-naapp-contracts"
version = "0.1.0"
description = "The contracts between aweb and its Native Agentic Apps (naapps): the app manifest, the egress guard, the hook wire formats and app task requests, with their conformance vectors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "awid", "aweb", "naapp", "manifest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
# The egress guard, aweb_naapp_contracts.egress: URL canonicalization, its own
# resolver and a pinned verified connection.
# publicsuffixlist is pinned exactly on purpose: the list decides which
# wildcard destinations are refused, so it changes only by a reviewed bump of
# this pin together with docs/vectors/egress-url-v2.json. Do not loosen it.
egress = [
  "dnspython>=2.7.0",
  "httpcore[asyncio]>=1.0.9",
  "idna>=3.10",
  "publicsuffixlist==1.1.0.20261018",
]
# aw-hooks, aweb_naapp_contracts.hooks: the catalog reader (stdlib), the event
# envelope, the delivery credential and the owner-act verifier with its nonce
# table; and the task-request contract, aweb_naapp_contracts.task_requests.
# They share awid's did:key and canonical-JSON primitives and pgdbm: importing
# them loads no web framework, settings or HTTP client (subprocess tests pin
# that).
hooks = [
  "awid-service>=0.5.40",
  "pgdbm>=0.5.0",
  "pynacl>=1.6.2",
]

[project.urls]
Homepage = "https://github.com/awebai/aweb/tree/main/naapp-contracts"
Repository = "https://github.com/awebai/aweb"
Issues = "https://github.com/awebai/aweb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_contracts"]

[tool.uv.sources]
awid-service = { path = "../awid", editable = true }
aweb-naapp-contracts-testing = { path = "testing", editable = true }

[dependency-groups]
dev = [
  "aweb-naapp-contracts[egress,hooks]",
  "aweb-naapp-contracts-testing",
  "cbor2>=6.1.2",
  "cryptography>=44.0.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
  "hatchling>=1.32.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
