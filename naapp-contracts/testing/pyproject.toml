[project]
name = "aweb-naapp-contracts-testing"
version = "0.1.0"
description = "Test support for the aweb naapp contracts: real AWID routes on PostgreSQL, AWID team members with a team-auth v2 signer, human members, and local DNS and TLS servers for the egress guard. Dev-only; never a production dependency."
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  # The first AWID release with the shared in-process registry fixtures.
  "awid-service>=0.5.33",
  "cryptography>=46.0.0",
  "dnspython>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_naapp_contracts_testing"]

[tool.uv.sources]
awid-service = { path = "../../awid", editable = true }
