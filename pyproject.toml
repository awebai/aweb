[project]
name = "library"
version = "0.1.0"
description = "Agent profiles, blueprints, and bindings for AWID teams"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "awid", "byot", "profiles", "blueprints"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aweb-naapp",
  "awid-service",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "pgdbm>=0.4.1",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pynacl>=1.6.2",
  "pyyaml>=6.0.3",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/awebai/library"
Repository = "https://github.com/awebai/library"
Issues = "https://github.com/awebai/library/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library"]

# awid-service is not on PyPI — it lives in the aweb repo's awid subdirectory, so
# it is pinned by git commit for reproducible (and Docker-buildable) installs.
# aweb-naapp is the sibling toolkit repo, pinned the same way by git commit so the
# Docker build fetches it without auth (the repo is public). pgdbm resolves from
# PyPI. Local cross-repo development still imports the sibling checkouts via the
# pytest pythonpath below.
[tool.uv.sources]
awid-service = { git = "https://github.com/awebai/aweb.git", subdirectory = "awid", rev = "0de73deb73c133c7fb85ad3de3d5827616e19500" }
aweb-naapp = { git = "https://github.com/awebai/aweb-naapp.git", rev = "a8bc8670771e101501baecc6da7d55f67f3802a7" }

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../aweb-naapp/src", "../aweb/awid/src", "../pgdbm/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: docker-backed end-to-end tests using real aw/awid tooling",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
