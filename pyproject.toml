[project]
name = "folio"
version = "0.1.0"
description = "Agent-first documents and presentations for AWID teams"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "awid", "byot", "documents", "presentations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aweb-naapp",
  "awid-service",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "markdown>=3.8.2",
  "nh3>=0.3.2",
  "pgdbm>=0.4.1",
  "pyjwt[crypto]>=2.10.1",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pynacl>=1.6.2",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/awebai/folio"
Repository = "https://github.com/awebai/folio"
Issues = "https://github.com/awebai/folio/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

# awid-service and aweb-naapp are not on PyPI — they live in sibling aweb repos and
# are pinned by git commit so the Docker build (uv sync --frozen) fetches them
# without auth (both repos are public). pgdbm resolves from PyPI. Local cross-repo
# development still imports the sibling checkouts via the pytest pythonpath below.
[tool.uv.sources]
awid-service = { git = "https://github.com/awebai/aweb.git", subdirectory = "awid", rev = "d0baafa389b600c8b0a12525797d6e38726c5252" }
aweb-naapp = { git = "https://github.com/awebai/aweb-naapp.git", rev = "6eb953251fecff3263027d8f1ca4991a3011c27b" }

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../aweb-naapp/src", "../aweb/awid/src", "../pgdbm/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: docker-backed end-to-end tests using real aw/awid tooling",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
