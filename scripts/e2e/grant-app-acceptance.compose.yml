# Test-only overlay for scripts/e2e-grant-app-tools.sh, layered over
# docker-compose.e2e.yml. It bounds every service at container creation. It
# changes no production defaults or validation.
services:
  postgres:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    labels:
      aweb.acceptance: grant-app-tools
  redis:
    cpus: "0.5"
    mem_limit: "256m"
    pids_limit: 256
    labels:
      aweb.acceptance: grant-app-tools
  awid:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    labels:
      aweb.acceptance: grant-app-tools
    environment:
      AWID_PUBLIC_REGISTRY_URL: http://awid:8010
      APP_ENV: test
  aweb:
    command: ["/app/.venv/bin/python", "/fixture/e2e/stack_server.py", "--app-origin", "https://library-grant.test:8765", "--ca-file", "/fixture/tls/ca.pem", "--user-agent", "grant-app-test/1", "--port", "8000", "--tls-certfile", "/fixture/tls/server.pem", "--tls-keyfile", "/fixture/tls/server.key"]
    environment:
      # Over TLS at its stack name with the stack CA: the team server the
      # client publishes, which Library reaches through its egress guard.
      AWEB_PUBLIC_ORIGIN: https://aweb-grant.test:8000
      AWID_PUBLIC_REGISTRY_URL: http://awid:8010
    volumes:
      - fixture:/fixture:ro
    # Library and the client share this namespace, so Library's TLS name and
    # the server's own both name this container on the stack's network.
    networks:
      default:
        aliases: [library-grant.test, aweb-grant.test]
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    labels:
      aweb.acceptance: grant-app-tools
  library:
    network_mode: service:aweb
    networks: !reset {}
    depends_on:
      aweb:
        condition: service_healthy
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    labels:
      aweb.acceptance: grant-app-tools
    command: ["/app/.venv/bin/uvicorn", "library.api:app", "--host", "0.0.0.0", "--port", "8765", "--ssl-keyfile", "/fixture/tls/server.key", "--ssl-certfile", "/fixture/tls/server.pem"]
    environment:
      LIBRARY_PUBLIC_ORIGIN: https://library-grant.test:8765
      LIBRARY_APP_KEY_FILES: '{"library:grant-read-1": "/fixture/library/grant-read.hex"}'
      # The stack's aweb is the team server Library reads grants from: its
      # operator's own, on the stack's network, reached through Library's
      # egress guard and trusted through the stack CA. The network itself comes
      # from scripts/e2e/stack-subnet.compose.yml.
      LIBRARY_TEAM_SERVER_INTERNAL_ORIGINS: '["https://aweb-grant.test:8000"]'
      LIBRARY_HOOK_CA_FILE: /fixture/tls/ca.pem
    volumes:
      - fixture:/fixture:ro
      # Library's template published from this stack's origin (library_stack_prepare.py).
      - library-source:/app/naapp/library/src/library
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://library-grant.test:8765/ready', context=ssl.create_default_context(cafile='/fixture/tls/ca.pem'))"]

  client:
    cpus: "2"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: scripts/e2e/folio-wakes-client.Dockerfile
    network_mode: service:aweb
    command: ["bash", "/fixture/e2e/grant_app_tools_client.sh"]
    environment:
      GRANT_APP_E2E_PROJECT: ${GRANT_APP_E2E_PROJECT:?set by runner}
    volumes:
      - fixture:/fixture:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  fixture:
    name: ${GRANT_APP_E2E_PROJECT:?set by runner}-fixture
  library-source:
    name: ${GRANT_APP_E2E_PROJECT:?set by runner}-library-source
