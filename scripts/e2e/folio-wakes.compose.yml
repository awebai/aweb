# Disposable real Folio/AWID/aweb acceptance stack. Run with --project-directory repository root.
services:
  postgres:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aweb
      POSTGRES_PASSWORD: aweb
      POSTGRES_DB: aweb
    # The runner creates Folio's separate library database before starting it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aweb -d aweb"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: awid/Dockerfile
    environment:
      AWID_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_PUBLIC_ORIGINS: http://awid:8010
      AWID_DB_SCHEMA: awid
      AWID_LOG_JSON: "false"
      AWID_RATE_LIMIT_BACKEND: redis
      AWID_RATE_LIMIT_DISABLED: "true"
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_SKIP_DNS_VERIFY: "1"
      APP_ENV: test
      AWID_ALLOW_INSECURE_DELIVERY_ORIGIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/ready"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  aweb:
    command: ["/app/.venv/bin/python", "/fixture/e2e/stack_server.py", "--app-origin", "https://folio-wakes.test:8765", "--ca-file", "/fixture/tls/ca.pem", "--user-agent", "folio-wakes-test/1", "--port", "38000", "--tls-certfile", "/fixture/tls/server.pem", "--tls-keyfile", "/fixture/tls/server.key"]
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      AWEB_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWEB_REDIS_URL: redis://redis:6379/0
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 38000
      # Over TLS with the fixture's folio-wakes.test certificate: the team's
      # server, which Folio reaches through its egress guard.
      AWEB_PUBLIC_ORIGIN: https://folio-wakes.test:38000
      APP_ENV: development
      AWEB_LOG_JSON: "false"
      AWID_REGISTRY_URL: http://awid:8010
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_PUBLIC_REGISTRY_URL: http://awid:8010
    volumes:
      - fixture:/fixture:ro
    networks:
      default:
        aliases: [folio-wakes.test]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awid:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/fixture/tls/ca.pem", "https://folio-wakes.test:38000/ready"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  folio:
    command: ["/app/.venv/bin/uvicorn", "folio.api:app", "--host", "0.0.0.0", "--port", "8765", "--ssl-keyfile", "/fixture/tls/server.key", "--ssl-certfile", "/fixture/tls/server.pem"]
    # The app and client share the server's signed loopback audience.
    network_mode: service:aweb
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: naapp/folio/Dockerfile
    environment:
      FOLIO_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/library
      FOLIO_AWID_REGISTRY_URL: http://awid:8010
      FOLIO_AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      FOLIO_PUBLIC_ORIGIN: ${FOLIO_WAKES_ORIGIN:?set by wakes runner}
      FOLIO_APP_EVENTS_ORIGIN: https://folio-wakes.test:38000
      # The team server folio_wakes.py publishes: this stack's own aweb, the
      # operator's own on the stack's network, reached through Folio's egress
      # guard and trusted through the fixture's CA. The network itself comes
      # from scripts/e2e/folio-wakes-subnet.compose.yml.
      FOLIO_TEAM_SERVER_INTERNAL_ORIGINS: '["https://folio-wakes.test:38000"]'
      FOLIO_HOOK_CA_FILE: /fixture/tls/ca.pem
      # App events go to aweb over the same TLS origin.
      SSL_CERT_FILE: /fixture/tls/ca.pem
      FOLIO_APP_EMIT_KID: folio:emit-test
      FOLIO_APP_EMIT_KEY_SEED_HEX: '0101010101010101010101010101010101010101010101010101010101010101'
      FOLIO_APP_KEY_FILES: ${FOLIO_WAKES_APP_KEY_FILES:?set by wakes runner}
      PORT: '8765'
    # This deployment's manifest, declaring the test emit key above; the harness
    # writes it before Folio starts and rewrites it to change the manifest.
    volumes:
      - folio-source:/app/naapp/folio/src/folio
      - fixture:/fixture:ro
    depends_on:
      aweb:
        condition: service_healthy

  client:
    cpus: "2"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: scripts/e2e/folio-wakes-client.Dockerfile
    network_mode: service:aweb
    environment:
      FOLIO_UNINSTALL_PROOF: ${FOLIO_UNINSTALL_PROOF:-0}
      FOLIO_WAKES_PROJECT: ${FOLIO_WAKES_PROJECT:-abrm-folio}
      AW_BIN: /usr/local/bin/aw
      FOLIO_WAKES_ORIGIN: https://folio-wakes.test:8765
      FOLIO_WAKES_MANIFEST: /folio-template/aweb-app.json
      FOLIO_WAKES_APP_KEY_FILES: '{}'
      SSL_CERT_FILE: /fixture/tls/ca.pem
    volumes:
      - fixture:/fixture:ro
      - folio-source:/folio-template
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  fixture:
    name: ${FOLIO_WAKES_PROJECT:-abrm-folio}-fixture
  folio-source:
