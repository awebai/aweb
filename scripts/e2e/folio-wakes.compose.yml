# Disposable real Folio/AWID/aweb acceptance stack. Run with --project-directory repository root.
services:
  postgres:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aweb
      POSTGRES_PASSWORD: aweb
      POSTGRES_DB: aweb
    # The runner creates Folio's content and independent ledger databases.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aweb -d aweb"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: awid/Dockerfile
    environment:
      AWID_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_DB_SCHEMA: awid
      AWID_LOG_JSON: "false"
      AWID_RATE_LIMIT_BACKEND: redis
      AWID_RATE_LIMIT_DISABLED: "true"
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_SKIP_DNS_VERIFY: "1"
      APP_ENV: test
      AWID_ALLOW_INSECURE_DELIVERY_ORIGIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  aweb:
    command: ["/app/.venv/bin/python", "/fixture/e2e/folio_wakes_server.py"]
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      AWEB_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/aweb
      AWEB_REDIS_URL: redis://redis:6379/0
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 38000
      AWEB_PUBLIC_ORIGIN: http://127.0.0.1:38000
      APP_ENV: development
      AWEB_LOG_JSON: "false"
      AWID_REGISTRY_URL: http://awid:8010
      AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      AWID_PUBLIC_REGISTRY_URL: http://awid:8010
    volumes:
      - fixture:/fixture:ro
    networks:
      default:
        aliases: [folio-wakes.test]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awid:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38000/health"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  folio:
    command: ["/app/.venv/bin/uvicorn", "folio.api:app", "--host", "0.0.0.0", "--port", "8765", "--ssl-keyfile", "/fixture/tls/server.key", "--ssl-certfile", "/fixture/tls/server.pem"]
    # The app and client share the server's signed loopback audience.
    network_mode: service:aweb
    cpus: "1"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: naapp/folio/Dockerfile
    environment:
      FOLIO_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/library
      # Compose retains these on every manifest-driven Folio recreation.
      AWEB_PAGE_DELETION_DATABASE_URL: postgresql://aweb:aweb@postgres:5432/folio_deletions
      AWEB_PAGE_RETENTION_POLICY: >-
        {"version":"synthetic-records-acceptance","content_purge_days":7,"audit_content_days":90,"backup_expiry_days":30,"backup_interval_hours":24,"restore_rpo_hours":24,"retry_horizon_days":30,"encrypted_backups":true,"legal_exceptions":[]}
      FOLIO_AWID_REGISTRY_URL: http://awid:8010
      FOLIO_AWID_SERVICE_TOKEN: library-e2e-service-token-with-at-least-32-bytes
      FOLIO_PUBLIC_ORIGIN: ${FOLIO_WAKES_ORIGIN:?set by wakes runner}
      FOLIO_APP_EVENTS_ORIGIN: http://127.0.0.1:38000
      FOLIO_APP_EMIT_KID: folio:emit-test
      FOLIO_APP_EMIT_KEY_SEED_HEX: '0101010101010101010101010101010101010101010101010101010101010101'
      FOLIO_APP_KEY_FILES: ${FOLIO_WAKES_APP_KEY_FILES:?set by wakes runner}
      PORT: '8765'
    # This deployment's manifest, declaring the test emit key above; the harness
    # writes it before Folio starts and rewrites it to change the manifest.
    volumes:
      - folio-source:/app/naapp/folio/src/folio
      - fixture:/fixture:ro
    depends_on:
      aweb:
        condition: service_healthy

  client:
    cpus: "2"
    mem_limit: "1g"
    pids_limit: 512
    build:
      context: .
      dockerfile: scripts/e2e/folio-wakes-client.Dockerfile
    network_mode: service:aweb
    environment:
      FOLIO_UNINSTALL_PROOF: ${FOLIO_UNINSTALL_PROOF:-0}
      FOLIO_RECORDS_BROWSER_EVIDENCE: /browser-evidence
      AW_BIN: /usr/local/bin/aw
      FOLIO_WAKES_ORIGIN: https://folio-wakes.test:8765
      FOLIO_WAKES_MANIFEST: /folio-template/aweb-app.json
      FOLIO_WAKES_APP_KEY_FILES: '{}'
      SSL_CERT_FILE: /fixture/tls/ca.pem
    volumes:
      - fixture:/fixture:ro
      - folio-source:/folio-template
      - browser-evidence:/browser-evidence
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  browser-evidence:
    name: abrm-folio-browser-evidence
  fixture:
    name: abrm-folio-fixture
  folio-source:
